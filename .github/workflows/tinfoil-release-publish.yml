name: Tinfoil Release - Publish
run-name: Publish ${{ github.ref_name }}

on:
  workflow_dispatch:

concurrency:
  group: tinfoil-container-publish-${{ github.ref_name }}

jobs:
  measure-and-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Measure image, attest, and publish release
        uses: tinfoilsh/measure-image-action@59f7ab5dbe472b3097c888ebe64e6a4131fc0975 # v0.14.0
        with:
          config-file: ${{ github.workspace }}/tinfoil-config.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
