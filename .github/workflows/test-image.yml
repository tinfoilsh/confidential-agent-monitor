name: Private test image
on:
  push:
    branches: [codex/rc2-private-test]
    paths-ignore: [tinfoil-config.yml, README.md]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - name: Require a private repository and package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY --jq .private)" = true
          if gh api /orgs/tinfoilsh/packages/container/confidential-agent-monitor > /tmp/package.json 2>/tmp/package-error; then
            test "$(jq -r .visibility /tmp/package.json)" = private
          elif ! grep -q '(HTTP 404)' /tmp/package-error; then
            cat /tmp/package-error
            exit 1
          fi
      - name: Build and push private image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/$GITHUB_REPOSITORY:test-$GITHUB_SHA"
          docker build --platform linux/amd64 --provenance=false --sbom=false --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$image" .
          docker push "$image"
          docker image inspect --format '{{index .RepoDigests 0}}' "$image" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(gh api /orgs/tinfoilsh/packages/container/confidential-agent-monitor --jq .visibility)" = private
