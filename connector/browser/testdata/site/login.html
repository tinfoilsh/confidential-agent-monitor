<!doctype html>
<meta charset="utf-8">
<title>Sign in</title>
<h1>Sign in</h1>
<form id="form">
  <p><label>User <input id="user" autocomplete="username"></label></p>
  <p><label>Password <input id="password" type="password" autocomplete="current-password"></label></p>
  <p><button>Sign in</button></p>
</form>
<p id="wrong" hidden>Wrong password</p>
<script>
  form.onsubmit = e => {
    e.preventDefault()
    if (password.value !== 'fixture') return void (wrong.hidden = false)
    sessionStorage.user = user.value
    location.href = 'code.html'
  }
</script>
