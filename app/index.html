function review(a, key, c) {
  const name = connName(a, key), s = view.status[name] ?? {};
  if (s.state === "connecting") return `<section><h2>${esc(name)}</h2><p class="muted">Connecting…</p></section>`;
  if (s.error) return `<section><h2>${esc(name)}</h2><p class="bad">Can't connect: ${esc(s.error)}</p></section>`;
  if (!s.blocked) return "";
  const count = (sign) => s.changes.filter((x) => x.startsWith(sign)).length;
  return `<section><h2>${esc(name)}</h2><p>${c.title} changed its tools: ${count("+")} new, ${count("~")} changed, ${count("-")} removed.</p>
    <details><summary class="muted">${s.blocked} tools await review</summary><pre>${esc(s.changes.join("\n\n"))}</pre></details>
    <div class="row"><span></span><button class="primary" onclick="approve(${q(a)}, ${q(key)})">Approve</button></div></section>`;
}

const approve = (a, key) => patch({ accounts: { [a]: { connections: { [key]: { mcp: { pin: view.status[connName(a, key)].pin } } } } } }, undefined,
  (state) => { state.view.status[connName(a, key)] = { ...state.view.status[connName(a, key)], blocked: 0, changes: [] }; });

const saveAccount = run(async (a) => {
  const acc = accounts()[a], update = answers();
  if (acc.preset === "custom_api") putPath(update, ["connections", "", "http", "slots"], [readAPISlot(acc.connections?.[""]?.http?.slots?.[0]?.value)]);
  for (const f of plain(entry(a))) {
    const value = read(f);
    const delta = changes(fieldValue(acc, f), value);
    if (delta !== undefined) for (const path of paths(f)) putSetting(update, acc, path, delta);
  }
  const credentials = credentialFields(a), modes = credentials.map((f) => $("mode-" + f.key));
  for (const f of credentials) {
    const mode = $("mode-" + f.key).value;
    if (mode === "replace") {
      const value = read(f);
      if (value === "") throw new Error(`Enter a value for ${f.label}, or cancel the replacement.`);
      putPath(update, f.path, value);
    }
    if (mode === "clear") putPath(update, f.path, null);
  }
  const body = { accounts: { [a]: update } };
  await edit((state) => previewConfig(state, body), () => api("PATCH", "/", body));
  credentials.forEach((f, i) => {
    if ($("mode-" + f.key) === modes[i] && modes[i].value !== "keep") credentialMode(a, f.key, "keep");
  });
});

// A grant template fills from the account's plain settings; one that needs a setup-only value, such as an OAuth client, cannot.
function grantTemplate(a, f) {
  const values = Object.fromEntries(plain(entry(a)).map((p) => [p.key, fieldValue(accounts()[a], p)]));
  const grant = f?.oauth && filled(f.oauth, values);
  return grant && !/\{\w+\}/.test(JSON.stringify(grant)) ? grant : undefined;
}

// Sign-in leaves the current credential usable until the exchange succeeds.
const signIn = run(async (a, key) => {
  const f = credentialFields(a).find((f) => f.key === key);
  // A stored grant keeps its client and endpoints; only an unset or static value starts from the template.
  const grant = f?.kind?.startsWith("oauth") ? undefined : grantTemplate(a, f);
  const credential = grant && { oauth: grant };
  const { url } = await api("POST", `/accounts/${encodeURIComponent(a)}/sign-in`, { path: f.path, redirect: location.origin + location.pathname, credential });
  sessionStorage.setItem(RETURN, location.hash);
  location.href = url;
});

// Identities may not name a missing account, so removing one also clears it from every agent.
const removeAccount = (a) => patch({
  accounts: { [a]: null },
  policies: { [a]: null },
  identities: Object.fromEntries(Object.keys(ids()).map((n) => [n, { accounts: { [a]: null } }])),
}, "activity");

// The live browser view keeps its markup fixed so polling never replaces the image, focus or typed text; liveSync owns its lifetime.
let live = {};
const liveConnection = (a) => {
  const key = Object.entries(accounts()[a]?.connections ?? {}).find(([, c]) => c.browser)?.[0];
  return key == null ? null : connName(a, key);
};
const liveCard = (a) => liveConnection(a) == null ? "" : `<section class="account-card live" aria-label="Browser"><div class="section-heading"><h2>Browser</h2>
  <span id="live-owner" class="live-owner" role="status"></span><button id="live-take" class="primary" onclick="liveOwn()"></button></div>
  <fieldset id="live-input" class="live-body" disabled>
    <div class="live-bar"><button onclick="liveAct({ action: 'back' })">Back</button><input id="live-url" aria-label="Address" onkeydown="if (event.key === 'Enter') liveNavigate()"><button onclick="liveNavigate()">Go</button></div>
    <div id="live-tabs" class="live-tabs" role="group" aria-label="Tabs"></div>
    <div id="live-screen" class="live-screen" tabindex="0" aria-label="Page. While you have control, click, scroll and type here." onkeydown="liveKey(event)" onwheel="liveWheel(event)"><img id="live-shot" alt="" hidden onclick="liveClick(event)"></div>
    <div class="live-bar"><input id="live-text" aria-label="Text to type" placeholder="Text to type" onkeydown="if (event.key === 'Enter') liveType()"><button onclick="liveType()">Type</button>
      <span class="seg" role="group" aria-label="Keys">${["Enter", "Tab", "Backspace", "Escape"].map((k) => `<button onclick="liveAct({ action: 'key', key: '${k}' })">${k === "Escape" ? "Esc" : k}</button>`).join("")}</span></div>
  </fieldset>
  <p id="live-error" class="bad live-error" role="alert" hidden></p>
  <div class="card-footer"><span class="muted">Page dialog</span><fieldset id="live-dialog" class="seg" aria-label="Page dialog" disabled>
    <button onclick="liveAct({ action: 'dialog', accept: true })">Accept</button><button onclick="liveAct({ action: 'dialog', accept: false })">Dismiss</button></fieldset></div></section>`;
const liveActive = () => live.name != null && !document.hidden && !locked && !!sessionStorage.getItem(KEY);
const liveReady = () => !!(live.frame?.owner && live.frame.frame) && !live.owning;

function liveSync() {
  const [kind, a] = route(), name = kind === "account" && view ? liveConnection(a) : null;
  if (name !== live.name) {
    clearTimeout(live.timer);
    live = { name, seq: 0, after: 0, queue: [] };
  }
  paintLive();
  if (!live.timer) livePoll();
}

function paintLive() {
  const f = live.frame, shot = $("live-shot");
  if (!shot) return;
  $("live-owner").textContent = !f ? "Connecting…" : f.owner ? "You have control. The agent is paused." : "The agent has control.";
  $("live-take").textContent = { pause: "Pausing…", resume: "Returning…" }[live.owning] ?? (f?.owner ? "Return to agent" : "Pause and take control");
  $("live-take").disabled = !!live.owning;
  $("live-input").disabled = !liveReady();
  $("live-dialog").disabled = !f?.owner || !!live.owning;
  shot.hidden = !f?.screenshot;
  if (f?.screenshot) Object.assign(shot, { src: "data:image/jpeg;base64," + f.screenshot, alt: f.tabs?.find((t) => t.active)?.title || f.url });
  if (f?.url && document.activeElement !== $("live-url")) $("live-url").value = f.url;
  const tabs = (f?.tabs ?? []).map((t) => `<button aria-pressed="${t.active}" title="${esc(t.url)}" onclick="liveAct({ action: 'tab', tab: ${q(t.id)} })">${esc(t.title || t.url)}</button>`).join("");
  if (drawn.get($("live-tabs")) !== tabs) { $("live-tabs").innerHTML = tabs; drawn.set($("live-tabs"), tabs); }
  const error = live.error || (f?.error ? "Couldn't show the page. If it opened a dialog, accept or dismiss it." : "");
  Object.assign($("live-error"), { textContent: error, hidden: !error, title: live.error ? "" : f?.error ?? "" });
}

// Every response is the whole state, so one sent before the newest shown frame or action is out of date and dropped.
async function liveRequest(l, body) {
  const seq = ++l.seq;
  if (body) l.after = seq;
  const f = await api(body ? "POST" : "GET", `/connections/${encodeURIComponent(l.name)}/browser`, body);
  if (seq < l.after) return;
  Object.assign(l, { after: seq, frame: f, error: "" });
  paintLive();
}

async function livePoll() {
  const l = live;
  l.timer = clearTimeout(l.timer);
  if (!liveActive() || l.polling || l.queue.length || l.owning) return;
  const after = l.after;
  l.polling = true;
  try { await liveRequest(l); } catch (err) { if (l.after === after) { l.error = err.message; paintLive(); } }
  l.polling = false;
  liveSchedule(l);
}

function liveSchedule(l) {
  if (l === live && liveActive() && !l.timer) l.timer = setTimeout(livePoll, LIVE_POLL_MS);
}

async function liveOwn() {
  const l = live, action = l.frame?.owner ? "resume" : "pause";
  if (l.owning) return;
  l.owning = action;
  l.queue.splice(1);
  paintLive();
  let failed = false;
  try { await liveRequest(l, { action }); } catch (err) { failed = true; toast(err.message); }
  l.owning = null;
  if (l !== live) return;
  paintLive();
  // A failed request may still have changed control, so look again rather than trust the last frame.
  failed ? livePoll() : liveSchedule(l);
}

// Input runs in order, each aimed at the frame on screen when the owner gave it.
function liveAct(body) {
  const l = live, frame = l.frame?.frame, last = l.queue.at(-1);
  if (body.action === "dialog" ? !l.frame?.owner || l.owning : !liveReady()) return;
  if (l.queue.length > 1 && last.action === body.action && last.frame === frame && ["type", "scroll"].includes(body.action)) {
    if (body.action === "type") last.text += body.text; else last.dy += body.dy;
    return;
  }
  l.queue.push({ ...body, frame });
  if (l.queue.length === 1) liveDrain(l);
}

async function liveDrain(l) {
  while (l.queue.length && l === live) {
    try { await liveRequest(l, l.queue[0]); } catch (err) { l.queue.splice(1); toast(err.message); }
    l.queue.shift();
  }
  liveSchedule(l);
}

// Screenshot pixels are the page's viewport pixels, whatever size the image is drawn at.
function livePoint(e) {
  const img = $("live-shot"), r = img.getBoundingClientRect(), scale = img.naturalWidth / r.width;
  return { x: (e.clientX - r.left) * scale, y: (e.clientY - r.top) * scale };
}
const liveClick = (e) => liveAct({ action: "click", ...livePoint(e) });

function liveWheel(e) {
  if (!liveReady()) return;
  e.preventDefault();
  liveAct({ action: "scroll", ...livePoint(e), dy: e.deltaY * (e.deltaMode ? WHEEL_LINE_PX : 1) });
}

function liveKey(e) {
  if (e.ctrlKey || e.metaKey || e.altKey || !liveReady()) return;
  const body = e.key.length === 1 ? { action: "type", text: e.key } : LIVE_KEYS.includes(e.key) ? { action: "key", key: e.key } : null;
  if (!body) return;
  e.preventDefault();
  liveAct(body);
}

function liveType() {
  if ($("live-text").value) liveAct({ action: "type", text: $("live-text").value });
  $("live-text").value = "";
}

function liveNavigate() {
  const url = $("live-url").value.trim();
  if (url) liveAct({ action: "navigate", url: url.includes("://") ? url : "https://" + url });
  $("live-screen").focus();
}

const integrationCode = (id, title, text, copy = true) => `<div class="integration-code"><div class="row"><span>${esc(title)}</span>${copy ? `<button type="button" onclick="copyIntegration(${q(id)})" aria-label="Copy ${esc(title)}">Copy</button>` : `<span class="badge">Proposed command</span>`}</div><pre id="${esc(id)}">${esc(text)}</pre></div>`;

const copyIntegration = run(async (id) => {
  const block = $(id);
  try {
    await navigator.clipboard.writeText(block.textContent);
    toast("Copied");
  } catch {
    const selection = window.getSelection();
    if (selection) {
      const range = document.createRange();
      range.selectNodeContents(block);
      selection.removeAllRanges();
      selection.addRange(range);
    }
    toast(selection ? "Text selected. Press Cmd-C or Ctrl-C to copy." : "Select the command text and copy it.");
  }
});

function integrations(page = "start") {
  const pages = { start: "Start here", wrapped: "Wrap commands", shell: "Monitor shell", mcp: "MCP gateway", plan: "Delivery plan" };
  if (!Object.hasOwn(pages, page)) page = "start";
  const setupLinks = Object.keys(ids()).map((name) => `<li><a href="#agent-settings/${encodeURIComponent(name)}">${esc(name)} setup</a></li>`).join("");
  const contents = {
    start: `<h1>Use Monitor from your tools</h1><p>Keep service credentials in Monitor. Connect a command, a terminal session, or an agent through an identity with the access you choose.</p>
      <div class="integration-options">
        <a class="integration-option" href="#integrations/wrapped"><strong>Wrap commands</strong><span>Run an existing CLI or script through Monitor.</span><small class="ok">Available in the laptop client</small></a>
        <a class="integration-option" href="#integrations/shell"><strong>Monitor shell</strong><span>Use the same setup for an entire terminal session.</span><small class="ok">Available in the laptop client</small></a>
        <a class="integration-option" href="#integrations/mcp"><strong>MCP gateway</strong><span>Connect an MCP client to the tools your identity can reach.</span><small class="ok">Managed local endpoint</small></a>
      </div>
      <h2>Set up an identity first</h2><ol>
        <li>Add the service in <b>Add account</b> and configure its credentials in Monitor.</li>
        <li>Create a dedicated SSH key on the computer running your tools. <a href="#pair">Pair its public key</a> as an agent, even when you will use it from your own terminal.</li>
        <li>Open that agent and grant access to the accounts it needs. Use separate identities for your laptop and automated workers when they need different permissions.</li>
        <li>Configure an SSH alias named <code>monitor</code> for the Monitor server, using that private key and the host key shown in the agent's settings. The SSH address and port come from your deployment, not the web app URL.</li>
      </ol><p>The private SSH key stays on your computer. Tool integrations use that identity; they do not need the web app's owner key.</p>
      <h2>Your agent setup</h2>${setupLinks ? `<ul>${setupLinks}</ul>` : `<p>No agents are paired yet. <a href="#pair">Pair an agent</a> to get started.</p>`}
      <p>Agent settings include the host key, CA certificate, and credential placeholders. If the existing Monitor client is installed, <code>monitor connections --json</code> checks which connections its SSH identity can reach.</p>
      <h2>Install the client</h2><p>Use Python 3.11 or newer and OpenSSH. From the Monitor repository:</p>
      ${integrationCode("integration-install", "Install on your laptop", 'mkdir -p "$HOME/.local/bin"\ninstall -m 755 client/monitor "$HOME/.local/bin/monitor"\nexport PATH="$HOME/.local/bin:$PATH"\nmonitor connections --json')}
      <p>The Go binary embeds the same client. The commands below use your paired SSH alias and verify its host key. See <code>docs/laptop-client.md</code> in the repository for complete SSH setup and local profile examples.</p>`,
    wrapped: `<h1>Wrap an existing command</h1><p><span class="badge">Available</span> Run a CLI or script locally, with its service requests routed through Monitor. Keep the command's arguments, working directory, output, and exit status.</p>
      ${integrationCode("integration-run", "Run a command", "monitor run -- gh api user\nmonitor run -- ./release.sh")}
      <h2>How it works</h2><ol><li>Use your paired SSH alias, or select a configured local profile.</li><li>The client opens a tunnel and prepares proxy settings, certificate trust, and the selected accounts' credential placeholders.</li><li>It starts the command and passes those settings to its children. Monitor checks requests and substitutes the real credentials before sending them upstream.</li><li>When the command exits, the client closes its tunnel and temporary files.</li></ol>
      <h2>When to use it</h2><p>Start here for an existing GitHub workflow, a one-off command, or a script. With a configured profile, use <code>monitor --profile work run -- gh pr list</code>.</p>
      <h2>Compatibility</h2><p>Programs must support the configured proxy and certificate settings. This mode does not force every network request through Monitor. Git HTTPS receives proxy, trust, and placeholder credential settings. SSH remotes need a separate Monitor SSH connection. Account policy and preset coverage still apply to each request.</p>
      <p>The wrapper stops if setup fails and ends the child session if its tunnel is lost. It never retries writes automatically. Your parent terminal keeps its original environment.</p>
      <h2>Use your accounts</h2><p>All connections are available by default. Shared credential names get separate variables per connection, such as <code>MONITOR_CREDENTIAL_ANTHROPIC_TOKEN</code>. For a tool that needs one account default, use <code>monitor run --connection work -- gh api user</code>. Connection names come from <code>monitor connections</code>.</p>`,
    shell: `<h1>Start a Monitor shell</h1><p><span class="badge">Available</span> Open a local terminal session with the same connection setup as a wrapped command.</p>
      ${integrationCode("integration-shell", "Open a shell", "monitor shell\ngh api user\nexit")}
      <h2>How it works</h2><p>The shell uses the wrapper's profiles, tunnel, credential placeholders, and certificate handling. Its prompt shows the active SSH alias or profile. Commands run in your local working directory.</p>
      <p>Type <code>exit</code> to return to the original terminal environment. User startup files are skipped to preserve routing and account selection. Each nested Monitor session owns its own tunnel.</p>
      <h2>When to use it</h2><p>Use a shell for a sequence of commands that share an identity. Choose <code>monitor run</code> for automation that needs a single command and a predictable exit status.</p>
      <h2>What it covers</h2><p>This session configures cooperating tools and their children. Other terminals and desktop apps have their own environments. A managed workspace with network restrictions is a separate option when every connection must pass through Monitor.</p>
      <h2>Select a shell</h2><p>Use <code>monitor shell --shell /bin/bash</code> or <code>monitor shell --shell /bin/zsh</code>. The shell includes all connections by default. Use the connection-specific credential variables when names overlap. The Linux integration suite exercises both shells; macOS validation remains open.</p>`,
    mcp: `<h1>Connect an MCP client</h1><p><span class="badge">Available</span> The gateway combines configured MCP connections into one Streamable HTTP server. Your SSH identity determines which accounts it can reach; tool calls still follow Monitor policy.</p>
      <h2>1. Prepare the connection</h2><p>Complete the <a href="#integrations/start">identity setup</a>. Add an account with an MCP connection, grant the paired identity access, and review tools awaiting approval on the account page. An HTTP API connection alone does not add tools to this gateway.</p>
      <p>The commands below assume an SSH alias named <code>monitor</code> with the correct identity and a verified host key. You need an MCP client that supports Streamable HTTP.</p>
      <h2>2. Keep the gateway running</h2>
      ${integrationCode("integration-mcp-serve", "Serve the gateway", "monitor mcp serve --listen 127.0.0.1:8400")}
      <p>The client checks MCP initialization and tool discovery before reporting readiness. Put <code>--ssh-config /path/to/ssh_config</code> before <code>mcp</code> to use a separate configuration. Use port 0 to choose a free port.</p>
      <h2>3. Add a server in your MCP client</h2><ul><li>Name: <code>monitor</code></li><li>Transport: <b>Streamable HTTP</b></li><li>URL:</li></ul>
      ${integrationCode("integration-endpoint", "MCP server URL", "http://127.0.0.1:8400/")}
      <p>No provider token or owner key goes in the client configuration. The SSH tunnel authenticates to Monitor. Programs on this computer can use the local endpoint as that identity; close the tunnel with Ctrl-C when finished.</p>
      <h2>4. Check the connection</h2><p>Refresh the client's tool list. Tool names start with their Monitor connection name and <code>__</code>, such as <code>work-mcp__list_issues</code>. Call a read tool and check <a href="#activity">Activity</a> for the expected agent and account. Requests that need a decision appear in <a href="#needs">Approvals</a>.</p>
      <h2>If it does not connect</h2><ul><li><b>SSH fails:</b> check the server address, paired public key, private key, and host key.</li><li><b>No tools:</b> check account access, the MCP connection's status, and tool review. An identity with no reachable MCP connections cannot open the gateway.</li><li><b>Client cannot reach the URL:</b> keep the tunnel running on the same computer as the client. A client in a container has its own localhost.</li><li><b>A tool fails or times out:</b> inspect Activity and the provider state before retrying a change.</li></ul>
      <p>Clients that only support stdio still need a separate adapter. <code>monitor mcp stdio</code> is not implemented.</p>`,
    plan: `<h1>Delivery plan</h1><p>Ship one client with shared setup for all three approaches. Start with macOS and Linux. Wrapped commands, bash and zsh sessions, local profiles, and managed MCP HTTP forwarding are implemented. Enrollment automation, diagnostics, stdio, and macOS acceptance testing remain open. The milestones below describe the full release criteria.</p>
      <ol><li><b>Package setup and diagnostics.</b> Distribute the existing client independently of the sandbox. Add local profiles, identity enrollment instructions, pinned host keys, certificate setup, account selection, and <code>monitor doctor</code>. A fresh laptop must discover its allowed connections without a provider token.</li>
        <li><b>Ship wrapped commands.</b> Add <code>monitor run -- …</code>, process-scoped proxy and trust settings, placeholder mapping, Git transport setup, signal forwarding, and cleanup. Verify the GitHub workflow from reading an issue through pushing a branch and opening a PR.</li>
        <li><b>Ship Monitor shell.</b> Reuse the wrapper for interactive bash and zsh sessions. Show the active profile, handle nested sessions and disconnects, and restore the original environment on exit.</li>
        <li><b>Package the MCP gateway.</b> Add a managed local HTTP endpoint, readiness checks, and a stdio adapter. Provide validated client configuration examples and clear account/tool status. This work can proceed alongside the wrapper after shared setup.</li>
        <li><b>Finish onboarding and verify the release.</b> Replace proposed examples with tested commands. Add per-identity setup downloads and checks to this page. Verify approvals, revoked access, reconnects, occupied ports, and missing permissions on both supported operating systems.</li></ol>
      <h2>Ready to release when</h2><p>A user with no local GitHub login can set up an identity, run a GitHub command, enter and leave a shell, and call an MCP tool by following these guides. Activity shows the right identity and account. A denied action stays denied, and interrupted writes are never retried automatically.</p>
      <p>The wrapper and shell cover tools that honor their connection settings. Enforced network routing remains a separate managed-workspace feature.</p>`,
  };
  return [head("Integrations"), `<nav class="integration-nav" aria-label="Integration guides">${Object.entries(pages).map(([key, title]) => `<a href="#integrations/${key}" ${page === key ? 'aria-current="page"' : ""}>${title}</a>`).join("")}</nav>`, `<article class="integration-guide">${contents[page]}</article>`];
}

const settings = () => [head("Settings"), `<section><h2>Lattices</h2>
  <p class="muted">Applies to all agents, connector requests and messages.</p>
  <label><input type="checkbox" ${lattices().confidentiality ? "checked" : ""} onchange="patch({ lattices: { confidentiality: this.checked } })"> Confidentiality lattice</label>
  <p class="muted">Restrict where agents can send private data. On by default.</p>
  <label><input type="checkbox" ${lattices().integrity ? "checked" : ""} onchange="patch({ lattices: { integrity: this.checked } })"> Integrity lattice</label>
  <p class="muted">Restrict sensitive actions after agents read untrusted content. Off by default.</p>
  <p class="muted">Labels keep their history while enforcement is off. Access permissions, explicit approvals and custom rules still apply.</p>
  </section>`, `<section><h2>Networks</h2><label>Private networks the monitor may reach, one per line</label>
  <textarea id="networks" rows="4">${esc((view.config.allow_networks ?? []).join("\n"))}</textarea>
  <div class="row"><span></span><button onclick="patch({ allow_networks: $('networks').value.split(/\\s+/).filter(Boolean) })">Save</button></div></section>`];

window.addEventListener("hashchange", render);
document.addEventListener("visibilitychange", liveSync);
setInterval(run(async () => {
  if (!sessionStorage.getItem(KEY) || locked) return;
  await refresh();
  render();
}), REQUEST_POLL_MS);
// The provider redirects back here with the sign-in's state and either a code or an error.
const back = new URLSearchParams(location.search);
if (back.has("state")) history.replaceState(null, "", location.pathname + (sessionStorage.getItem(RETURN) ?? ""));
run(async () => {
  await iconsReady;
  if (!sessionStorage.getItem(KEY)) return;
  await refresh();
  if (back.has("error")) throw new Error(back.get("error_description") ?? back.get("error"));
  if (!back.has("code")) return;
  render();
  toast("Finishing sign-in…");
  remember(await api("POST", `/sign-in/${encodeURIComponent(back.get("state"))}`, { code: back.get("code") }));
  toast("Signed in");
})().then(render);
</script>
