<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor</title>
<style>
  :root {
    --bg: #fff; --side: #fafafa; --hover: #f4f4f5; --hi: #e0f2fe; --line: #e4e4e7; --edge: #d4d4d8; --text: #27272a; --muted: #a1a1aa; --dim: #71717a;
    --link: #0369a1; --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #18181b; --side: #1f1f23; --hover: #27272a; --hi: #0c4a6e; --line: #2e2e33; --edge: #3f3f46; --text: #e4e4e7; --muted: #71717a; --dim: #a1a1aa; --link: #7dd3fc; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 12px/20px system-ui, sans-serif; }
  pre, textarea, .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; }
  #app { display: grid; grid-template-columns: 240px 1fr 400px; height: 100vh; }
  #tree { border-right: 1px solid var(--line); padding: 4px 0; overflow: auto; }
  #list { overflow: auto; }
  #pane { border-left: 2px solid var(--edge); background: var(--side); padding: 0 8px 8px; overflow: auto; }
  #gate { max-width: 24rem; margin: 20vh auto; }
  a, .new { color: var(--link); text-decoration: none; }
  .node { display: flex; gap: 4px; align-items: center; padding: 0 8px 0 calc(6px + var(--depth) * 12px); color: inherit; white-space: nowrap; cursor: pointer; }
  .node > i { width: 10px; flex-shrink: 0; font-size: 9px; font-style: normal; color: var(--muted); }
  .node > span { overflow: hidden; text-overflow: ellipsis; }
  .node > small { margin-left: auto; padding-left: 8px; font-size: 10px; color: var(--muted); }
  .node:hover, .q:hover, .ev:hover { background: var(--hover); }
  .node.on, .q.on, .ev.on { background: var(--hi); }
  .group { display: flex; gap: 8px; align-items: center; padding: 2px 8px; }
  .q, .ev { display: grid; gap: 8px; align-items: center; padding: 0 8px; color: inherit; white-space: nowrap; }
  .q { grid-template-columns: 10px 64px 1fr auto auto; }
  .ev { grid-template-columns: 64px 72px 96px 1fr 64px; border-bottom: 1px solid var(--line); }
  .q > a, .ev > span { overflow: hidden; text-overflow: ellipsis; color: inherit; }
  .bang { font-weight: 700; color: var(--warn); }
  h2, .hd { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 2px; }
  header { display: flex; gap: 8px; align-items: baseline; padding: 6px 0 2px; }
  header > .x { margin-left: auto; color: var(--muted); }
  section { padding: 8px 0; border-bottom: 1px solid var(--line); }
  button { font: inherit; font-size: 11px; line-height: 18px; padding: 0 6px; border: 1px solid var(--edge); background: var(--bg); color: var(--text); cursor: pointer; }
  button.primary { background: var(--text); border-color: var(--text); color: var(--bg); }
  button.inherited { border-color: var(--text); }
  button.danger { color: var(--bad); }
  .seg { display: inline-flex; flex-shrink: 0; }
  .seg > button + button { border-left: 0; }
  input, select, textarea { font: inherit; padding: 1px 6px; border: 1px solid var(--edge); background: var(--bg); color: var(--text); width: 100%; }
  input[type=checkbox] { width: auto; }
  label { display: block; font-size: 11px; color: var(--dim); margin: 6px 0 1px; }
  .acct { padding: 4px 0; border-bottom: 1px solid var(--line); }
  .action { margin-left: calc(var(--depth) * 12px); }
  .row { display: flex; gap: 6px; align-items: center; justify-content: space-between; margin-top: 4px; }
  .row > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 400; color: var(--dim); }
  td { padding: 2px 4px 2px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  ul { margin: 4px 0; padding-left: 16px; }
  pre { background: var(--bg); border: 1px solid var(--line); padding: 2px 8px; white-space: pre-wrap; word-break: break-all; max-height: 24rem; overflow: auto; }
  .muted, .empty { color: var(--muted); } .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .empty { padding: 0 8px; }
  #toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: .4rem 1rem; max-width: 40rem; }
</style>
<div id="gate" hidden></div>
<div id="app" hidden><aside id="tree"></aside><div id="list"></div><aside id="pane"></aside></div>
<div id="toast" hidden></div>
<script>
const KEY = "monitor-owner-key", GENERATION = "monitor-generation", DISMISSED = "monitor-dismissed", RETURN = "monitor-sign-in-return";
const REQUEST_POLL_MS = 5000, TOAST_MS = 5000;
const LEVELS = { off: "No access", read: "Read only", ask: "Ask", allow: "Allow" }, MODES = { allow: "Allow", ask: "Ask", off: "Deny" }, AUDIENCES = ["me", "team", "anyone"];
const WHO = { me: "Only me", team: "My team", anyone: "Anyone" };
const SEES = { me: "only you", team: "your team", anyone: "anyone" };
const STATE_CLASS = { allowed: "ok", approved: "ok", refused: "bad", denied: "bad", expired: "warn", pending: "warn" };
// A new preset starts as one bearer-token API; the owner sets its origin, slots and operations.
const NEW_PRESET = { catalog: { fields: [{ key: "token", label: "API token", secret: true, path: ["connections", "", "http", "values", "token"] }],
  connections: { "": { http: { slots: [{ value: "token", origin: "https://api.example.com", path: "/", header: "Authorization", prefix: "Bearer " }] } } },
  defaults: { contents: "me", strangers: true, sends: "me" } }, operations: [] };

// scope is the agent or account the activity list follows; it outlives selecting a request.
let view = null, records = [], locked = false, scope = null;
const expanded = new Set(["agents", "accounts"]);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const q = (v) => esc(JSON.stringify(v));
const opt = (value, text, selected) => `<option value="${esc(value)}" ${value === selected ? "selected" : ""}>${esc(text)}</option>`;
const ids = () => view.config.identities ?? {};
const accounts = () => view.config.accounts ?? {};
const entry = (account) => view.templates[accounts()[account]?.policy_options?.preset] ?? view.templates[accounts()[account]?.template] ?? view.templates.custom;
// Each pinned MCP tool is an action under read or use, by the hint the owner approved with the pin.
const actionsOf = (account) => ({ ...groupsOf(account), ...entry(account).actions, ...Object.fromEntries(Object.values(accounts()[account]?.connections ?? {})
  .flatMap((c) => c.mcp?.pin?.tools ?? []).map((t) => [`${t.annotations?.readOnlyHint ? "read" : "use"}.${t.name}`, { title: t.title || t.name }])) });
// An api account's actions are the permission groups of its preset's operations.
const operationsOf = (account) => accounts()[account]?.template === "api" ? entry(account).operations ?? [] : [];
const groupsOf = (account) => Object.fromEntries(operationsOf(account).map((o) => [o.action, { title: o.action }]));
// effectsOf unions the effects of every operation under an action, so a group shows its strictest obligations.
const effectsOf = (account, k) => entry(account).effects?.[k.split(".")[0]]
  ?? [...new Set(operationsOf(account).filter((o) => o.action === k || o.action.startsWith(k + ".")).flatMap((o) => o.effects))];
const tree = (actions) => Object.entries(actions).sort(([a], [b]) => a.localeCompare(b)).map(([k, x]) => [k, x, k.split(".").length - 1]);
const fill = (text, scope) => text.replace(/\{(\w+)\}/g, (m, k) => scope?.[k] ?? m);
const route = () => location.hash.slice(1).split("/").map(decodeURIComponent);
const pendingSoonest = () => records.filter((r) => r.state === "pending").sort((a, b) => new Date(a.expires) - new Date(b.expires));
const left = (r) => {
  const s = Math.max(0, Math.round((new Date(r.expires) - Date.now()) / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};

function toast(text) {
  $("toast").textContent = text;
  $("toast").hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => ($("toast").hidden = true), TOAST_MS);
}

// run surfaces a failed action as a toast.
const run = (fn) => async (...args) => {
  try { await fn(...args); } catch (err) { toast(err.message); }
};

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { Authorization: "Bearer " + sessionStorage.getItem(KEY) }, body: body && JSON.stringify(body) });
  const text = await res.text();
  if (res.status === 401) sessionStorage.removeItem(KEY);
  locked = res.status === 423;
  if (!res.ok) { render(); throw new Error(text.trim()); }
  return text ? JSON.parse(text) : null;
}

function remember(v) {
  view = v;
  localStorage.setItem(GENERATION, Math.max(v.generation, +localStorage.getItem(GENERATION) || 0));
}

async function refresh() {
  remember(await api("GET", "/"));
  records = await api("GET", "/requests");
  const pending = records.filter((r) => r.state === "pending").length;
  document.title = pending ? `(${pending}) Monitor` : "Monitor";
}

const patch = run(async (body, then) => {
  remember(await api("PATCH", "/", body));
  toast("Saved");
  then ? (location.hash = then) : render();
});

// sync redraws only the keyed parts whose markup changed, so open details, focus and typed input elsewhere survive.
const drawn = new WeakMap();
function sync(el, parts) {
  const old = new Map([...el.children].map((c) => [c.dataset.key, c]));
  let at = el.firstElementChild;
  for (const [key, html] of parts) {
    let node = old.get(key);
    old.delete(key);
    if (!node || drawn.get(node) !== html) {
      const t = document.createElement("template");
      t.innerHTML = html;
      const fresh = t.content.firstElementChild;
      fresh.dataset.key = key;
      drawn.set(fresh, html);
      node?.replaceWith(fresh);
      if (node === at) at = fresh;
      node = fresh;
    }
    if (node === at) at = at.nextElementSibling;
    else el.insertBefore(node, at);
  }
  old.forEach((c) => c.remove());
}

function render() {
  const gate = !sessionStorage.getItem(KEY) ? keyPage()
    : locked ? `<section><p>Your monitor restarted.</p><button class="primary" onclick="unlock()">Unlock</button></section>`
    : !view ? `<p class="empty">Loading…</p>` : "";
  $("gate").hidden = !gate;
  $("app").hidden = !!gate;
  sync($("gate"), gate ? [["gate", gate]] : []);
  if (gate) return;
  const [kind, ...args] = route();
  if (kind === "agent" || kind === "account") scope = [kind, args[0]];
  if (kind === "activity") scope = null;
  const panes = { request: requestPane, agent, pair, account, add, preset: presetPage, rules, settings };
  sync($("tree"), sidebar(kind, args[0]));
  sync($("list"), list(kind === "request" && args[0]));
  sync($("pane"), (panes[kind]?.(...args) ?? [`<p class="empty">Select an agent, account or request.</p>`])
    .map((html, i) => [`${location.hash}/${i}`, html]).filter(([, html]) => html));
}

const head = (title, sub = "") => `<header><b>${title}</b><span class="muted">${sub}</span><a class="x" href="#">✕</a></header>`;
const node = (key, attrs, label, depth, { open, count = "", on } = {}) => [key,
  `<a class="node ${on ? "on" : ""}" ${attrs} style="--depth: ${depth}"><i>${open == null ? "" : open ? "▾" : "▸"}</i><span>${label}</span><small>${count}</small></a>`];
const folder = (key, label, count) => node(key, `onclick="toggle('${key}')"`, label, 0, { open: expanded.has(key), count });
const link = (path, label, depth, on, count) => node(path.join("/"), `href="#${path.map(encodeURIComponent).join("/")}"`, label, depth, { on, count });

function toggle(key) {
  expanded.has(key) ? expanded.delete(key) : expanded.add(key);
  render();
}

function sidebar(kind, arg) {
  const pending = pendingSoonest(), at = (k, a) => kind === k && arg === a;
  const templates = Object.entries(view.templates).sort(([, a], [, b]) => a.title.localeCompare(b.title));
  const saved = Object.values(ids()).reduce((n, id) => n + (id.rules?.length ?? 0), 0);
  return [
    node("needs", `href="#${pending.length ? "request/" + pending[0].id : "activity"}"`, `<span class="bang">!</span> Needs you`, 0, { count: pending.length || "" }),
    folder("agents", "Agents", Object.keys(ids()).length),
    ...(expanded.has("agents") ? [...Object.keys(ids()).map((n) => link(["agent", n], `${pending.some((r) => r.identity === n) ? `<span class="bang">!</span> ` : ""}${esc(n)}`, 1,
      at("agent", n), esc(view.labels[n] ? `${view.labels[n].audience} / ${view.labels[n].trust}` : ""))), link(["pair"], `<span class="new">Pair agent…</span>`, 1, kind === "pair")] : []),
    folder("accounts", "Accounts", Object.keys(accounts()).length),
    ...(expanded.has("accounts") ? Object.keys(accounts()).map((a) => link(["account", a], `${esc(a)} <span class="muted">${esc(entry(a).title)}</span>`, 1, at("account", a), accountStatus(a))) : []),
    folder("add", "Add account", templates.length),
    ...(expanded.has("add") ? [...templates.map(([t, c]) => link(["add", t], esc(c.title), 1, at("add", t),
      Object.keys(accounts()).filter((a) => entry(a) === c).length || "")), link(["preset"], `<span class="new">New preset…</span>`, 1, kind === "preset" && !arg)] : []),
    link(["rules"], "Rules", 0, kind === "rules", saved || ""),
    link(["activity"], "Activity", 0, kind === "activity"),
    link(["settings"], "Settings", 0, kind === "settings"),
  ];
}

function keyPage() {
  return `<section><label>Owner key</label><input id="key" type="password"><div class="row"><span></span><button class="primary" onclick="setKey()">Continue</button></div></section>`;
}

const setKey = run(async () => {
  sessionStorage.setItem(KEY, $("key").value.trim());
  await refresh();
  render();
});

const unlock = run(async () => {
  remember(await api("POST", "/unlock", { generation: +localStorage.getItem(GENERATION) || 0 }));
  await refresh();
  render();
});

function summary(e) {
  if (e?.message) return `${e.message.from} → ${e.message.to}`;
  if (e?.http) return `${e.http.method} ${e.http.host}${e.http.path}`;
  if (e?.smtp) return `To ${e.smtp.to.join(", ")}${e.mail?.subject ? `: ${e.mail.subject}` : ""}`;
  if (e?.imap) return `${e.imap.command} ${e.imap.args}`;
  if (e?.mcp) return e.mcp.tool;
  return "";
}

function reasons(r) {
  const title = entry(r.account).title;
  return (r.gaps ?? []).map((g) => ({
    ask: r.action == null ? `${title} doesn't recognize this request.` : `You asked to approve changes on ${r.account}.`,
    audience: `It has seen private data from ${r.label.because?.audience}, and ${SEES[r.sends]} can see this.`,
    trust: `It has read content from strangers on ${r.label.because?.trust}, so it may be following their instructions.`,
  })[g]);
}

// A saved approval binds one operation and its grant. The text names fields, not values, which can be whole messages;
// fields left out of the grant are named as broad.
function grantText(operation, grant, scope) {
  const fields = Object.keys(grant ?? {}), broad = Object.keys(scope ?? {}).filter((k) => !fields.includes(k));
  return `Allow ${operation} ${fields.length ? "for the same " + fields.join(", ") : "for any request"}`
    + (broad.length ? `, with any ${broad.join(", ")}` : "");
}
const saveText = (r) => grantText(r.operation, r.grant, r.scope);
const saveButton = (r, text, primary) => r.action == null || !r.operation ? ""
  : `<button class="${primary ? "primary" : ""}" title="${esc(saveText(r))}" onclick="answer('${r.id}', 'save')">${esc(text)}</button>`;
const decide = (r, saveLabel) => r.state === "pending"
  ? `<button onclick="answer('${r.id}', 'once')">Allow once</button>${saveButton(r, saveLabel, true)}<button class="danger" onclick="answer('${r.id}', 'deny')">Deny</button>`
  : r.state === "expired" ? `${saveButton(r, saveLabel)}<button onclick="dismiss('${r.id}')">Dismiss</button>` : "";

function list(selected) {
  const dismissed = JSON.parse(localStorage.getItem(DISMISSED) ?? "[]");
  const open = [...pendingSoonest(), ...records.filter((r) => r.state === "expired" && !dismissed.includes(r.id))];
  const shown = records.filter((r) => !scope || r[scope[0] === "agent" ? "identity" : "account"] === scope[1]);
  return [
    ["needs", `<div class="group"><span class="bang">!</span><b>Needs you</b><span class="muted">all agents · soonest first</span></div>`],
    ...open.map((r) => ["q/" + r.id, `<div class="q ${r.id === selected ? "on" : ""}"><span class="bang">!</span><span>${esc(r.identity)}</span>
      <a href="#request/${r.id}"><span class="muted">${esc(r.account)}</span> <b class="mono">${esc(r.title || summary(r.event))}</b> <span class="muted">· ${esc(reasons(r)[0])}</span></a>
      <span class="mono warn">${r.state === "pending" ? left(r) : "expired"}</span><span class="seg">${decide(r, "Save rule")}</span></div>`]),
    ...(open.length ? [] : [["calm", `<p class="empty">Nothing needs you.</p>`]]),
    ["activity", `<div class="group"><b>Activity</b><span class="muted">${scope ? `${scope[0]} ${esc(scope[1])} · <a href="#activity">show all</a>` : "all agents"}</span></div>`],
    ["columns", `<div class="ev hd"><span>Time</span><span>Agent</span><span>Account</span><span>Operation</span><span>Result</span></div>`],
    ...shown.map((r) => ["e/" + r.id, `<a class="ev ${r.id === selected ? "on" : ""}" href="#request/${r.id}"><span class="mono muted">${new Date(r.time).toLocaleTimeString()}</span>
      <span>${esc(r.identity)}</span><span>${esc(r.account)}</span><span class="mono">${esc(r.title || summary(r.event))}</span><span class="${STATE_CLASS[r.state]}">${r.state}</span></a>`]),
    ...(shown.length ? [] : [["quiet", `<p class="empty">Nothing yet.</p>`]]),
  ];
}

function requestPane(id) {
  const r = records.find((r) => r.id === id);
  if (!r) return [head("Request"), `<p class="empty">No request ${esc(id)}.</p>`];
  const buttons = decide(r, saveText(r));
  return [head(esc(r.title || summary(r.event) || r.account), `${esc(r.identity)} · ${esc(r.account)}${r.state === "pending" ? ` · ${left(r)} left` : ""}`),
    `<section><div class="row"><span class="${STATE_CLASS[r.state]}">${r.state}</span><span class="muted">${new Date(r.time).toLocaleTimeString()}</span></div>
      <ul>${reasons(r).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
      <div class="mono">${esc(summary(r.event))}</div>
      ${r.operation ? `<details><summary class="muted">${esc(r.operation)} grant</summary><pre>${esc(JSON.stringify(r.grant))}</pre></details>` : ""}
      <label>Request</label><pre>${esc(JSON.stringify(r.event, null, 2))}</pre>
      <div class="row">${draftLink(r) || "<span></span>"}${buttons ? `<span class="seg">${buttons}</span>` : ""}</div></section>`];
}

const answer = run(async (id, decision) => {
  await api("POST", `/requests/${id}`, { decision });
  await refresh();
  render();
});

function dismiss(id) {
  localStorage.setItem(DISMISSED, JSON.stringify([...JSON.parse(localStorage.getItem(DISMISSED) ?? "[]"), id]));
  render();
}

function labelStatus(l) {
  const lines = [l?.audience !== "anyone" && `Has seen private data from ${l.because?.audience}`, l?.trust === "untrusted" && "Has read content from strangers"];
  return lines.filter(Boolean).join(" · ") || "Clean";
}

const pair = () => [head("Pair an agent"), `<section><label>Name</label><input id="name"><label>Public key</label><textarea id="pubkey" rows="3"></textarea>
  <div class="row"><span></span><button class="primary" onclick="pairAgent()">Pair</button></div></section>`];

const pairAgent = () => patch({ identities: { [$("name").value.trim()]: { key: $("pubkey").value.trim(), accounts: {} } } }, "agent/" + encodeURIComponent($("name").value.trim()));

function ruleSentence(r) {
  if (!r.operation) return `Inactive: ${r.action} on ${r.account} was saved before approvals named an operation`;
  return `${grantText(r.operation, r.scope, r.scope)} on ${r.account}, despite ${r.waives.join(" and ")}`;
}

// mode mirrors lib.rego: the most specific override wins, effects that ask still ask at allow,
// effects without change are allowed and the rest follow the level.
function mode(access, vocabulary, effects, k) {
  const lineage = k.split(".").map((_, i, p) => p.slice(0, p.length - i).join("."));
  const has = (name) => effects.some((e) => vocabulary[e]?.[name]);
  return lineage.map((a) => access.actions?.[a]).find(Boolean)
    ?? (access.level === "allow" && has("ask") ? "ask" : has("change") ? (access.level === "read" ? "off" : access.level) : "allow");
}

function agent(name) {
  const id = ids()[name];
  if (!id) return [head(esc(name)), `<p class="empty">No agent ${esc(name)}.</p>`];
  const levels = Object.entries(accounts()).map(([a, acc]) => {
    const access = id.accounts?.[a] ?? { level: "off" };
    const c = entry(a);
    const actions = access.level === "off" ? [] : tree(actionsOf(a)).map(([k, x, d]) => {
      const effects = effectsOf(a, k), inherited = mode({ ...access, actions: { ...access.actions, [k]: null } }, c.vocabulary, effects, k);
      const own = access.actions?.[k];
      return `<div class="row action" style="--depth: ${d}"><span>${esc(x.title)} <span class="muted">${esc(effects.join(", "))}</span></span><span class="seg">${Object.entries(MODES).map(([m, t]) =>
        `<button class="${m === own ? "primary" : !own && m === inherited ? "inherited" : ""}" onclick="patchAccess(${q(name)}, ${q(a)}, { actions: { [${q(k)}]: ${q(m === own ? null : m)} } })">${t}</button>`).join("")}</span></div>`;
    });
    return `<div class="acct"><div class="row"><b>${esc(a)}</b><span class="seg">${Object.entries(LEVELS).map(([l, t]) =>
      `<button class="${l === access.level ? "primary" : ""}" onclick="patchAccess(${q(name)}, ${q(a)}, { level: ${q(l)} })">${t}</button>`).join("")}</span></div>${actions.join("")}</div>`;
  });
  const reaches = (pred) => Object.entries(accounts()).some(([a, acc]) => (id.accounts?.[a]?.level ?? "off") !== "off" && pred(acc));
  const hint = reaches((acc) => acc.template === "web") && reaches((acc) => acc.contents !== "anyone")
    ? `<p class="warn">Once it reads private data, browsing will need approval. A separate agent for browsing avoids that.</p>` : "";
  const others = Object.keys(ids()).filter((n) => n !== name);
  const l = view.labels[name] ?? {};
  const point = (axis, values) => `<div class="row"><span>${axis}</span><span class="seg">${values.map((v) =>
    `<button class="${l[axis] === v ? "primary" : ""}" onclick="setLabel(${q(name)}, ${q({ trust: l.trust, audience: l.audience, [axis]: v })})">${v}</button>`).join("")}</span></div>`;
  return [head(esc(name), esc(labelStatus(l))),
    `<section>${id.profile ? `<p class="warn">Profiling: every request runs unchecked and is recorded.</p>` : ""}${hint}${point("trust", ["trusted", "untrusted"])}${point("audience", ["anyone", "team", "me"])}</section>`,
    `<section><h2>Access</h2>${levels.join("") || `<p class="empty">No accounts yet.</p>`}</section>`,
    messageSettings(name, others),
    rulesSection(name),
    `<section><details><summary class="hd">Setup</summary><label>Host key</label><pre>${esc(view.host_key)}</pre><label>CA</label><pre>${esc(view.ca)}</pre><label>Environment</label><pre>${esc(view.setup[name]) || "No secrets to substitute."}</pre></details></section>`,
    `<section><h2>Replace key</h2><p class="muted">Use this after recreating the sandbox. The agent starts clean.</p><textarea id="pubkey" rows="2"></textarea>
      <div class="row"><span></span><button onclick="patch({ identities: { [${q(name)}]: { key: $('pubkey').value.trim() } } })">Replace key</button></div></section>`,
    others.length ? `<section><h2>Copy settings from</h2><div class="row"><select id="from">${others.map((n) => opt(n, n)).join("")}</select><button onclick="copySettings(${q(name)})">Copy</button></div></section>` : "",
    `<section><button class="danger" onclick="removeAgent(${q(name)})">Remove agent</button></section>`];
}

function rulesSection(name) {
  const list = (ids()[name].rules ?? []).map((r, i) => `<div class="row"><span>${esc(ruleSentence(r))}${r.operation
    ? `<details><summary class="muted">grant</summary><pre>${esc(JSON.stringify(r.scope))}</pre></details>` : ""}</span><button onclick="removeRule(${q(name)}, ${i})">Remove</button></div>`);
  return `<section><h2>Saved rules · ${esc(name)}</h2>${list.join("") || `<p class="muted">None yet. They come from “Allow this next time”.</p>`}</section>`;
}

const rules = () => [head("Rules"), ...Object.keys(ids()).filter((n) => ids()[n].rules?.length).map(rulesSection)];

function messageSettings(name, peers) {
  const messages = ids()[name].messages ?? {};
  return `<section><h2>Agent messages</h2><p class="muted">Both agents must permit a channel. Sending and polling apply its disclosure and trust limits, even when the inbox is empty. Changing a limit or revoking a channel clears its queued messages.</p>
    ${peers.length ? `<table><tr><th>Agent</th><th>May send to</th><th>Receive audience</th><th>Receive trust</th></tr>${peers.map((peer) => {
      const limit = messages.receive?.[peer];
      return `<tr><td>${esc(peer)}</td><td><input type="checkbox" ${messages.send?.includes(peer) ? "checked" : ""} onchange="setMessageSend(${q(name)}, ${q(peer)}, this.checked)"></td>
        <td><select onchange="setMessageReceive(${q(name)}, ${q(peer)}, 'audience', this.value)">${["off", "anyone", "team", "me"].map((v) => opt(v, v, limit?.audience ?? "off")).join("")}</select></td>
        <td><select ${limit ? "" : "disabled"} onchange="setMessageReceive(${q(name)}, ${q(peer)}, 'trust', this.value)">${["trusted", "untrusted"].map((v) => opt(v, v, limit?.trust ?? "trusted")).join("")}</select></td></tr>`;
    }).join("")}</table>` : `<p class="empty">Pair another agent to enable messaging.</p>`}</section>`;
}

const setMessageSend = (name, peer, enabled) => {
  const send = (ids()[name].messages?.send ?? []).filter((p) => p !== peer);
  if (enabled) send.push(peer);
  return patch({ identities: { [name]: { messages: { send } } } });
};

const setMessageReceive = (name, peer, axis, value) => patch({ identities: { [name]: { messages: { receive: {
  [peer]: value === "off" ? null : { audience: "anyone", trust: "trusted", ...ids()[name].messages?.receive?.[peer], [axis]: value },
} } } } });

const removeAgent = (name) => patch({ identities: Object.fromEntries(Object.entries(ids()).map(([peer, id]) => [peer,
  peer === name ? null : { messages: id.messages ? { send: (id.messages.send ?? []).filter((p) => p !== name), receive: { [name]: null } } : null },
])) }, "activity");

const patchAccess = (name, account, access) => patch({ identities: { [name]: { accounts: { [account]: access } } } });

const setLabel = run(async (name, label) => {
  remember(await api("POST", "/labels/" + encodeURIComponent(name), label));
  render();
});

const removeRule = (name, i) => patch({ identities: { [name]: { rules: ids()[name].rules.filter((_, j) => j !== i) } } });

// Merge patches merge nested objects, so the old settings are cleared before the copy lands.
const copySettings = run(async (name) => {
  const from = ids()[$("from").value];
  remember(await api("PATCH", "/", { identities: { [name]: { accounts: null, rules: null } } }));
  patch({ identities: { [name]: { accounts: from.accounts ?? {}, rules: from.rules ?? [] } } });
});

const mcpKeys = (a) => Object.entries(accounts()[a].connections ?? {}).filter(([, kinds]) => kinds.mcp).map(([key]) => key);
const connName = (a, key) => (key ? `${a}-${key}` : a);

function accountStatus(a) {
  const states = mcpKeys(a).map((k) => view.status[connName(a, k)] ?? {});
  if (states.some((s) => s.error)) return `<span class="bad">Can't connect</span>`;
  if (states.some((s) => s.state === "connecting")) return `<span class="muted">Connecting…</span>`;
  const blocked = states.reduce((n, s) => n + (s.blocked ?? 0), 0);
  return blocked ? `<span class="warn">${blocked} tools await review</span>` : "";
}

// Shipped preset files, fetched as written so an owner's copy keeps their order and environment references.
const shippedFiles = {};
const loadShipped = run(async (name) => {
  shippedFiles[name] = await api("GET", "/presets/" + encodeURIComponent(name));
  render();
});
// The owner's version of a preset, else the shipped file once fetched, else a new preset.
const presetFile = (name) => view.config.presets?.[name] ?? shippedFiles[name] ?? (view.templates[name]?.preset ? undefined : { title: name, ...NEW_PRESET });

// Preset files keep one field, action and operation per line, as the shipped files do.
const EXPANDED = ["", "catalog", "catalog.fields", "catalog.actions", "operations"];
const compact = (v) => Array.isArray(v) ? `[${v.map(compact).join(", ")}]`
  : v && typeof v === "object" ? `{${Object.entries(v).map(([k, x]) => `${JSON.stringify(k)}: ${compact(x)}`).join(", ")}}` : JSON.stringify(v);
function presetText(v, path = "", indent = "") {
  if (!EXPANDED.includes(path) || v === null || typeof v !== "object") return compact(v);
  const [open, close, items] = Array.isArray(v) ? ["[", "]", v.map((x) => presetText(x, path + ".*", indent + "  "))]
    : ["{", "}", Object.entries(v).map(([k, x]) => `${JSON.stringify(k)}: ${presetText(x, path ? `${path}.${k}` : k, indent + "  ")}`)];
  return items.length ? `${open}\n${indent}  ${items.join(`,\n${indent}  `)}\n${indent}${close}` : open + close;
}

// Downloads the saved version, which the monitor has checked, as presets/<name>.json.
function downloadPreset(name) {
  const blob = new Blob([presetText(presetFile(name)) + "\n"], { type: "application/json" });
  Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: name + ".json" }).click();
}

// An unmatched request on a preset's account can become one of its operations.
const draftLink = (r) => r.action == null && r.event?.http && accounts()[r.account]?.policy_options?.preset
  ? `<a href="#preset/${encodeURIComponent(accounts()[r.account].policy_options.preset)}/${r.id}">Add operation</a>` : "";

// The draft matches only this exact path; the owner turns segments into {parameters} and sets its effects and scope.
function draftOperation(e) {
  const h = e.http, read = ["GET", "HEAD"].includes(h.method), params = Object.keys(h.query ?? {});
  return { id: `${h.method} ${h.path}`, action: read ? "read" : "write", effects: [read ? "read" : "write"], method: h.method, origin: h.origin, path: h.path,
    ...(params.length && { params }), ...(h.body_kind !== "none" && { body: ["json", "form"].includes(h.body_kind) ? h.body_kind : "any" }),
    ...(e.graphql?.fields?.length === 1 && { body: "graphql", graphql: { operation: e.graphql.kind, field: e.graphql.fields[0].name } }), scope: {} };
}

function presetPage(name, from) {
  if (!name) return [head("New preset"), `<section><label>Name</label><div class="row"><input id="preset-name"><button onclick="location.hash = 'preset/' + encodeURIComponent($('preset-name').value.trim())">Create</button></div></section>`];
  if (!presetFile(name)) {
    loadShipped(name);
    return [head("Preset " + esc(name)), `<p class="empty">Loading…</p>`];
  }
  const file = structuredClone(presetFile(name)), r = records.find((r) => r.id === from);
  if (r?.event?.http) file.operations = [...(file.operations ?? []), draftOperation(r.event)];
  const users = Object.entries(accounts()).filter(([, acc]) => acc.policy_options?.preset === name).map(([a]) => a);
  return [head("Preset " + esc(name)), `<section><p class="muted">Changes apply to every account using it: ${esc(users.join(", ") || "none yet")}.</p>
    <textarea id="preset" rows="40">${esc(presetText(file))}</textarea>
    <div class="row">${view.config.presets?.[name] ? `<button class="danger" onclick="patch({ presets: { [${q(name)}]: null } })">Remove your version</button>` : "<span></span>"}
      <span><button onclick="downloadPreset(${q(name)})">Download file</button> <button class="primary" onclick="savePreset(${q(name)})">Save</button></span></div></section>`];
}

const savePreset = run(async (name) => {
  await patch({ presets: { [name]: changes(view.config.presets?.[name], JSON.parse($("preset").value)) } }, "preset/" + encodeURIComponent(name));
});

function questions(a) {
  const pick = (id, value) => `<select id="${id}">${AUDIENCES.map((x) => opt(x, WHO[x], value)).join("")}</select>`;
  return `<label>Who should see what's in here?</label>${pick("contents", a.contents)}
    <label><input type="checkbox" id="strangers" ${a.strangers ? "checked" : ""}> Strangers can put content here</label>
    <label>Who sees what the agent sends here?</label>${pick("sends", a.sends)}`;
}

const answers = () => ({ contents: $("contents").value, strangers: $("strangers").checked, sends: $("sends").value });

function input(f, value, disabled = false) {
  const state = disabled ? "disabled" : "";
  if (f.json) value = value === undefined ? "" : JSON.stringify(value, null, 2);
  if (f.json || f.multiline) return `<textarea id="f-${esc(f.key)}" ${state} rows="6">${esc(value)}</textarea>`;
  return `<input id="f-${esc(f.key)}" ${state} type="${f.secret ? "password" : "text"}" placeholder="${esc(f.hint)}" value="${esc(f.list ? (value ?? []).join(", ") : value)}">`;
}

function read(f) {
  const raw = $("f-" + f.key).value;
  const v = f.secret ? raw : raw.trim();
  if (f.json) return v ? JSON.parse(v) : {};
  return f.list ? v.split(/[\s,]+/).filter(Boolean) : v;
}

const atPath = (object, path) => path.reduce((value, key) => value?.[key], object);
function putPath(object, path, value) {
  for (const key of path.slice(0, -1)) {
    if (!Object.hasOwn(object, key)) Object.defineProperty(object, key, { value: {}, enumerable: true });
    object = object[key];
  }
  Object.defineProperty(object, path.at(-1), { value, enumerable: true, configurable: true, writable: true });
}
const paths = (f) => f.paths ?? [f.path];
// A field with no paths, such as an OAuth client ID, only fills the account's templates when it is created.
const plain = (c) => c.fields.filter((f) => !f.secret && paths(f).length);
const fieldValue = (acc, f) => atPath(acc, f.path ?? paths(f)[0]) ?? (f.list ? [] : f.json ? {} : "");
// A merge patch replaces an array whole, so a setting inside one, such as a slot's origin, rewrites a copy of its array.
function putSetting(update, acc, path, value) {
  const n = path.findIndex((_, i) => i > 0 && Array.isArray(atPath(acc, path.slice(0, i))));
  if (n < 0) return putPath(update, path, value);
  const list = atPath(update, path.slice(0, n)) ?? JSON.parse(JSON.stringify(atPath(acc, path.slice(0, n))));
  path.slice(n, -1).reduce((o, k) => o[k], list)[path.at(-1)] = value;
  putPath(update, path.slice(0, n), list);
}
const filled = (c, values) => JSON.parse(JSON.stringify(c), (_, v) => typeof v === "string" ? fill(v, values) : v);

// Used for the custom JSON editor so removed settings become explicit deletions.
function changes(before, after) {
  if (JSON.stringify(before) === JSON.stringify(after)) return undefined;
  if (after === null || typeof after !== "object" || Array.isArray(after)) return after;
  return Object.fromEntries([...new Set([...Object.keys(before ?? {}), ...Object.keys(after)])]
    .map((key) => [key, Object.hasOwn(after, key) ? changes(before?.[key], after[key]) : null])
    .filter(([, value]) => value !== undefined));
}

function add(template) {
  const c = view.templates[template];
  if (!c) return [head("Add account"), `<p class="empty">No template ${esc(template)}.</p>`];
  return [head("Add " + esc(c.title)), `<section><label>Name</label><input id="account-name" value="${esc(template)}">
    ${c.fields.filter((f) => !f.edit_only).map((f) => `<label>${esc(f.label)}</label>${f.secret && !f.json ? `<select id="mode-${esc(f.key)}" onchange="$(${q("f-" + f.key)}).disabled = this.value !== 'replace'">${opt("replace", "Set value", f.oauth ? "oauth" : "replace")}${opt("clear", "Leave unconfigured")}${f.oauth ? opt("oauth", "Sign in after creating", "oauth") : ""}</select>` : ""}${input(f, f.default, !!f.oauth)}`).join("")}
    ${questions(c.defaults)}<div class="row"><span></span><button class="primary" onclick="addAccount(${q(template)})">Add</button></div></section>`,
    c.preset ? `<section><a href="#preset/${encodeURIComponent(c.preset)}">Edit operations</a></section>` : ""];
}

const addAccount = run(async (template) => {
  const c = view.templates[template], name = $("account-name").value.trim();
  const fields = c.fields.filter((f) => !f.edit_only);
  const values = Object.fromEntries(fields.map((f) => [f.key, read(f)]));
  // Only the non-secret values fill a preset's connections; secrets go to their fields' paths.
  const plainValues = Object.fromEntries(fields.filter((f) => !f.secret).map((f) => [f.key, values[f.key]]));
  const acc = { template: c.preset ? "api" : template, ...(c.preset && { policy_options: { preset: c.preset } }), ...answers(),
    connections: c.connections ? filled(c.connections, c.preset ? plainValues : values) : values.connections };
  for (const f of fields) {
    const mode = f.secret ? $("mode-" + f.key).value : "replace";
    const value = mode === "clear" ? null : mode === "oauth" ? { oauth: filled(f.oauth, values) } : values[f.key];
    for (const path of paths(f)) putPath(acc, path, value);
  }
  await patch({ accounts: { [name]: acc } }, "account/" + encodeURIComponent(name));
});

function credentialFields(a) {
  return (view.fields?.[a] ?? []).map((meta) => {
    const f = entry(a).fields.find((f) => paths(f).some((path) => JSON.stringify(path) === JSON.stringify(meta.path)));
    return { ...f, ...meta, key: meta.path.map(encodeURIComponent).join("/"), label: `${meta.path[1] || "Default"}: ${f?.label ?? meta.path.at(-1)}`, secret: true, multiline: true };
  }).sort((a, b) => a.key.localeCompare(b.key));
}

function credentialEditor(a, f) {
  const status = f.kind === "oauth-required" ? "Sign-in required" : f.kind === "unset" ? "Not configured" : `Configured · ${f.kind}`;
  return `<label>${esc(f.label)} · ${esc(status)}</label>
    <select id="mode-${esc(f.key)}" onchange="$(${q("f-" + f.key)}).disabled = this.value !== 'replace'"><option value="keep">Keep unchanged</option><option value="replace">Replace value</option><option value="clear">Clear credential</option></select>
    ${input(f, undefined, true)}${f.kind.startsWith("oauth") || grantTemplate(a, f) ? `<div class="row"><span></span><button onclick="signIn(${q(a)}, ${q(f.key)})">Sign in</button></div>` : ""}`;
}

function account(a) {
  const acc = accounts()[a];
  if (!acc) return [head(esc(a)), `<p class="empty">No account ${esc(a)}.</p>`];
  const c = entry(a);
  const users = Object.entries(ids()).filter(([, id]) => (id.accounts?.[a]?.level ?? "off") !== "off").map(([n, id]) => `${n} (${id.accounts[a].level})`);
  return [head(esc(a), `${esc(c.title)} ${accountStatus(a)}`),
    `<section>${questions(acc)}
      ${plain(c).map((f) => `<label>${esc(f.label)}</label>${input(f, fieldValue(acc, f))}`).join("")}
      ${credentialFields(a).map((f) => credentialEditor(a, f)).join("")}
      <div class="row"><span></span><button class="primary" onclick="saveAccount(${q(a)})">Save</button></div></section>`,
    `<section><h2>Actions</h2>${tree(actionsOf(a)).map(([k, x, d]) => `<div class="action" style="--depth: ${d}">${esc(x.title)} <span class="muted">${esc(effectsOf(a, k).join(", "))}</span></div>`).join("")}<p class="muted">Used by ${esc(users.join(", ") || "no agents")}</p>
      ${acc.template === "api" ? `<a href="#preset/${encodeURIComponent(acc.policy_options.preset)}">Edit operations</a>` : ""}</section>`,
    ...mcpKeys(a).map((k) => review(a, k, c)),
    `<section><details><summary class="hd">Custom rules</summary><textarea id="policy" rows="12">${esc(view.config.policies?.[a])}</textarea>
      <div class="row"><span></span><button onclick="patch({ policies: { [${q(a)}]: $('policy').value.trim() || null } })">Save rules</button></div></details></section>`,
    `<section><button class="danger" onclick="removeAccount(${q(a)})">Remove account</button></section>`];
}

function review(a, key, c) {
  const name = connName(a, key), s = view.status[name] ?? {};
  if (s.state === "connecting") return `<section><h2>${esc(name)}</h2><p class="muted">Connecting…</p></section>`;
  if (s.error) return `<section><h2>${esc(name)}</h2><p class="bad">Can't connect: ${esc(s.error)}</p></section>`;
  if (!s.blocked) return "";
  const count = (sign) => s.changes.filter((x) => x.startsWith(sign)).length;
  return `<section><h2>${esc(name)}</h2><p>${c.title} changed its tools: ${count("+")} new, ${count("~")} changed, ${count("-")} removed.</p>
    <details><summary class="muted">${s.blocked} tools await review</summary><pre>${esc(s.changes.join("\n\n"))}</pre></details>
    <div class="row"><span></span><button class="primary" onclick="approve(${q(a)}, ${q(key)})">Approve</button></div></section>`;
}

const approve = (a, key) => patch({ accounts: { [a]: { connections: { [key]: { mcp: { pin: view.status[connName(a, key)].pin } } } } } });

const saveAccount = (a) => {
  const acc = accounts()[a], update = answers();
  for (const f of plain(entry(a))) {
    const value = read(f);
    const delta = changes(fieldValue(acc, f), value);
    if (delta !== undefined) for (const path of paths(f)) putSetting(update, acc, path, delta);
  }
  for (const f of credentialFields(a)) {
    const mode = $("mode-" + f.key).value;
    if (mode === "replace") putPath(update, f.path, read(f));
    if (mode === "clear") putPath(update, f.path, null);
  }
  return patch({ accounts: { [a]: update } });
};

// A grant template fills from the account's plain settings; one that needs a setup-only value, such as an OAuth client, cannot.
function grantTemplate(a, f) {
  const values = Object.fromEntries(plain(entry(a)).map((p) => [p.key, fieldValue(accounts()[a], p)]));
  const grant = f?.oauth && filled(f.oauth, values);
  return grant && !/\{\w+\}/.test(JSON.stringify(grant)) ? grant : undefined;
}

// Sign-in leaves the current credential usable until the exchange succeeds.
const signIn = run(async (a, key) => {
  const f = credentialFields(a).find((f) => f.key === key);
  // A stored grant keeps its client and endpoints; only an unset or static value starts from the template.
  const grant = f?.kind?.startsWith("oauth") ? undefined : grantTemplate(a, f);
  const credential = grant && { oauth: grant };
  const { url } = await api("POST", `/accounts/${encodeURIComponent(a)}/sign-in`, { path: f.path, redirect: location.origin + location.pathname, credential });
  sessionStorage.setItem(RETURN, location.hash);
  location.href = url;
});

// Identities may not name a missing account, so removing one also clears it from every agent.
const removeAccount = (a) => patch({
  accounts: { [a]: null },
  policies: { [a]: null },
  identities: Object.fromEntries(Object.keys(ids()).map((n) => [n, { accounts: { [a]: null } }])),
}, "activity");

const settings = () => [head("Settings"), `<section><h2>Networks</h2><label>Private networks the monitor may reach, one per line</label>
  <textarea id="networks" rows="4">${esc((view.config.allow_networks ?? []).join("\n"))}</textarea>
  <div class="row"><span></span><button onclick="patch({ allow_networks: $('networks').value.split(/\\s+/).filter(Boolean) })">Save</button></div></section>`];

window.addEventListener("hashchange", render);
setInterval(run(async () => {
  if (!sessionStorage.getItem(KEY) || locked) return;
  await refresh();
  render();
}), REQUEST_POLL_MS);
// The provider redirects back here with the sign-in's state and either a code or an error.
const back = new URLSearchParams(location.search);
if (back.has("state")) history.replaceState(null, "", location.pathname + (sessionStorage.getItem(RETURN) ?? ""));
run(async () => {
  if (!sessionStorage.getItem(KEY)) return;
  await refresh();
  if (back.has("error")) throw new Error(back.get("error_description") ?? back.get("error"));
  if (!back.has("code")) return;
  render();
  toast("Finishing sign-in…");
  remember(await api("POST", `/sign-in/${encodeURIComponent(back.get("state"))}`, { code: back.get("code") }));
  toast("Signed in");
})().then(render);
</script>
