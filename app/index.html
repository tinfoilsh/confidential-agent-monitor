<!doctype html>
<html lang="en" data-ui="dashboard">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Monitor</title>
  <link rel="icon" href="icons/tinfoil-white.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/aeonik-fono-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div id="gate" hidden></div>
  <div id="app" hidden>
    <aside id="navigation" aria-label="Monitor navigation">
      <a class="brand" href="#activity"><img src="icons/tinfoil-white.svg" alt="Tinfoil"><span>Monitor</span></a>
      <button class="mobile-toggle" aria-label="Toggle navigation" aria-controls="tree" aria-expanded="false" onclick="toggleNavigation(this)">Menu</button>
      <nav id="tree" aria-label="Management"></nav>
      <div class="navigation-footer">
        <a href="fun_ui.html" id="fun-ui-link">Fun UI</a>
        <div><span class="owner-avatar" aria-hidden="true">M</span><span>Monitor owner<small>Local SSH connection</small></span><button id="theme-toggle" aria-label="Change color theme" onclick="cycleTheme()"></button></div>
      </div>
    </aside>
    <main id="workspace" tabindex="-1">
      <header id="page-header"></header>
      <div id="page-content">
        <div id="overview"></div>
        <div id="toolbar"></div>
        <div id="pane" hidden></div>
        <div id="list" aria-label="Activity"></div>
      </div>
    </main>
  </div>
  <div id="toast" role="status" hidden></div>
  <div id="saving" role="status" hidden>Saving…</div>
  <script type="module" src="./monitor.js"></script>
</body>
</html>
