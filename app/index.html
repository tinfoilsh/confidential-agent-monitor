<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor</title>
<style>
  :root {
    --bg: #fff; --side: #eaf3f8; --hover: #e3f4fd; --line: #cadbe5; --edge: #9db9cb; --text: #253e50; --muted: #6b8495; --dim: #4d6b80;

    --panel: radial-gradient(ellipse at 12% 0%, #fff, transparent 65%), linear-gradient(145deg, #eef5f8, #dae6ed 65%, #dcedec);

    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #182833; --side: #213847; --hover: #2b4b60; --line: #365366; --edge: #567b93; --text: #e2f0fa; --muted: #9ab5c8; --dim: #b1c8d8; --link: #8bd9ff; --ok: #79dca3; --warn: #f5cc7c; --bad: #ffa5a5;
      --control: linear-gradient(#4c7089, #3b5d76 46%, #29495f 52%, #355b73);
      --selected: linear-gradient(#527f9a, #3e6c89 46%, #2a5671 52%, #396b86);
      --panel: radial-gradient(ellipse at 12% 0%, #46697e66, transparent 65%), linear-gradient(145deg, #263d4d, #192e3e 65%, #203b40);
      --nav: linear-gradient(#294253, #1c303e); --card: linear-gradient(155deg, #2b4659, #1d3546);

      --primary: #83bfdf; --primary-fill: linear-gradient(#d4effb, #8fc9e2 46%, #65abcf 52%, #a1d5eb); --on-primary: #142735;
      --shine: #ffffff29; --shadow: #0004;

  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 12px/20px system-ui, sans-serif; }

  #app { display: grid; grid-template-columns: 240px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100vh; height: 100dvh; }

  .with-pane #list { grid-column: 3; border-left: 1px solid var(--edge); }

  .with-pane .ev { grid-template-columns: minmax(0, 1fr) auto; gap: 0 6px; padding: 5px 8px; }
  .with-pane .ev > :nth-child(1) { grid-column: 1; grid-row: 3; font-size: 10px; }
  .with-pane .ev > :nth-child(2) { grid-column: 1; grid-row: 1; font-weight: 600; }
  .with-pane .ev > :nth-child(3) { grid-column: 2; grid-row: 1; font-size: 10px; max-width: 110px; }
  .with-pane .ev > :nth-child(4) { grid-column: 1 / -1; grid-row: 2; white-space: normal; overflow-wrap: anywhere; }
  .with-pane .ev > :nth-child(5) { grid-column: 2; grid-row: 3; font-size: 10px; }
  .with-pane .ev.hd { display: none; }

  .with-pane .q > :nth-child(2) { grid-column: 2; grid-row: 1; }

  @media (max-width: 1100px) {
    #app, #app.with-pane { grid-template-columns: 180px minmax(0, 1fr); }
    #app.with-pane { grid-template-columns: 180px minmax(0, 1fr) 240px; }
  }
  @media (max-width: 900px) {

  }
  @media (max-width: 640px) {

    #app #pane, #app #list { grid-column: 1; grid-row: 2; }

  .muted, .empty { color: var(--muted); } .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }

  .action-children { margin-left: 8px; border-left: 1px solid var(--edge); }

</style>
<div id="gate" hidden></div>
<div id="app" hidden><aside id="tree" aria-label="Navigation"></aside><main id="pane" aria-label="Details" hidden></main><section id="list" aria-label="Activity and approvals"></section></div>
<div id="toast" hidden></div>

<script>
const KEY = "monitor-owner-key", GENERATION = "monitor-generation", DISMISSED = "monitor-dismissed", RETURN = "monitor-sign-in-return";
const REQUEST_POLL_MS = 5000, TOAST_MS = 5000, LIVE_POLL_MS = 1000, WHEEL_LINE_PX = 40;
// Tab is left out so keyboard focus can leave the page view; the Tab button sends it.
const LIVE_KEYS = ["Enter", "Backspace", "Delete", "Escape", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Home", "End", "PageUp", "PageDown"];
const LEVELS = { off: "No access", read: "Read only", ask: "Ask", allow: "Allow" }, MODES = { allow: "Allow", ask: "Ask", off: "Deny" }, AUDIENCES = ["me", "team", "anyone"];
const CATALOG_GROUPS = { api: "API", mcp: "MCP", protocol: "Protocol" };
const WHO = { me: "Only me", team: "My team", anyone: "Anyone" };
const SEES = { me: "only you", team: "your team", anyone: "anyone" };
const STATE_CLASS = { allowed: "", approved: "", refused: "bad", denied: "bad", expired: "muted", pending: "warn" };
// A new preset starts as one bearer-token API; the owner sets its origin, slots and operations.
const NEW_PRESET = { catalog: { group: "api", fields: [{ key: "token", label: "API token", secret: true, path: ["connections", "", "http", "values", "token"] }],
  connections: { "": { http: { slots: [{ value: "token", origin: "https://api.example.com", path: "/", header: "Authorization", prefix: "Bearer " }] } } },
  defaults: { contents: "me", strangers: true, sends: "me" } }, http: { operations: [] } };

// Keep the activity filter and return route while a request is open.
let view = null, records = [], locked = false, scope = null, requestSource = "activity";
let serverState = { view: null, records: [] }, sending = false, editVersion = 0, pollVersion = 0;
const pendingEdits = [];
let connectorIcons = {};
const iconsReady = fetch("icons/manifest.json").then((res) => res.ok ? res.json() : {}).then((icons) => { connectorIcons = icons; }).catch(() => {});
const expanded = new Set(["agents", "accounts"]);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const q = (v) => esc(JSON.stringify(v));
const opt = (value, text, selected) => `<option value="${esc(value)}" ${value === selected ? "selected" : ""}>${esc(text)}</option>`;
const ids = () => view.config.identities ?? {};
const accounts = () => view.config.accounts ?? {};
const lattices = () => ({ confidentiality: view.config.lattices?.confidentiality ?? true, integrity: view.config.lattices?.integrity ?? false });
const connectorIcon = (type) => {
  const icon = connectorIcons[type]?.src ? connectorIcons[type] : connectorIcons.custom ?? { src: "custom.svg" };
  return `<picture class="connector-icon" aria-hidden="true">${icon.dark ? `<source media="(prefers-color-scheme: dark)" srcset="icons/${esc(icon.dark)}">` : ""}<img src="icons/${esc(icon.src)}" width="14" height="14" alt=""></picture>`;
};
const accountIcon = (a) => connectorIcon(accounts()[a]?.preset ?? "custom");
const entry = (account) => view.presets[accounts()[account]?.preset] ?? view.presets.custom;
// Each pinned MCP tool is an action under read or use, by the hint the owner approved with the pin.
const actionsOf = (account) => ({ ...groupsOf(account), ...entry(account).actions, ...Object.fromEntries(Object.values(accounts()[account]?.connections ?? {})
  .flatMap((c) => c.mcp?.pin?.tools ?? []).map((t) => [`${t.annotations?.readOnlyHint ? "read" : "use"}.${t.name}`, { title: t.title || t.name }])) });
// Record operations also contribute permission groups to their preset.
const operationsOf = (account) => entry(account).operations ?? [];
const groupsOf = (account) => Object.fromEntries(operationsOf(account).map((o) => [o.action, { title: o.action }]));
// effectsOf unions the effects of every operation under an action, so a group shows its strictest obligations.
const effectGroups = new WeakMap();
const effectsOf = (account, k) => {
  const preset = entry(account), actions = preset.actions ?? {};
  let groups = effectGroups.get(preset);
  if (!groups) {
    groups = new Map();
    const add = (action, effects) => action.split(".").forEach((_, i, parts) => {
      const key = parts.slice(0, i + 1).join(".");
      if (!groups.has(key)) groups.set(key, new Set());
      for (const effect of effects) groups.get(key).add(effect);
    });
    for (const [action, meta] of Object.entries(actions)) add(action, meta.effects ?? []);
    for (const op of preset.operations ?? []) add(op.action, op.effects);
    effectGroups.set(preset, groups);
  }
  const lineage = k.split(".").map((_, i, parts) => parts.slice(0, i + 1).join(".")).reverse();
  const inherited = lineage.find((a) => actions[a]?.effects);
  return [...new Set([...(actions[inherited]?.effects ?? []), ...(groups.get(k) ?? [])])];
};
const tree = (actions) => Object.entries(actions).sort(([a], [b]) => a.localeCompare(b)).map(([k, x]) => [k, x, k.split(".").length - 1]);
const fill = (text, scope) => text.replace(/\{(\w+)\}/g, (m, k) => scope?.[k] ?? m);
const route = () => location.hash.slice(1).split("/").map(decodeURIComponent);
const pendingSoonest = () => records.filter((r) => r.state === "pending").sort((a, b) => new Date(a.expires) - new Date(b.expires));
const left = (r) => {
  const s = Math.max(0, Math.round((new Date(r.expires) - Date.now()) / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};

function toast(text) {
  $("toast").textContent = text;
  $("toast").hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => ($("toast").hidden = true), TOAST_MS);
}

// run surfaces a failed action as a toast.
const run = (fn) => async (...args) => {
  try { return await fn(...args); } catch (err) { render(); toast(err.message); }
};

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { Authorization: "Bearer " + sessionStorage.getItem(KEY) }, body: body && JSON.stringify(body) });
  const text = await res.text();
  if (res.status === 401) sessionStorage.removeItem(KEY);
  locked = res.status === 423;
  if (!res.ok) throw new Error(text.trim() || `Request failed (${res.status})`);
  return text ? JSON.parse(text) : null;
}

function remember(v) {
  serverState.view = v;
  localStorage.setItem(GENERATION, Math.max(v.generation, +localStorage.getItem(GENERATION) || 0));
  project();
}

// Reapply pending edits over the last confirmed snapshot, including after a failed save.
function project() {
  const next = structuredClone(serverState);
  for (const edit of pendingEdits) edit.update(next);
  view = next.view;
  records = next.records;
  $("saving").hidden = pendingEdits.length === 0;
  const count = pendingSoonest().length;
  document.title = count ? `(${count}) Monitor` : "Monitor";
}

async function refresh() {
  if (pendingEdits.length || sending) return;
  const version = editVersion, poll = ++pollVersion;
  const [next, log] = await Promise.all([api("GET", "/"), api("GET", "/requests")]);
  // A poll started before a click must never undo that click or a newer response.
  if (version !== editVersion || poll !== pollVersion || pendingEdits.length) return;
  serverState.records = log;
  remember(next);
}

function edit(update, send, { then, message = "Saved" } = {}) {
  return new Promise((resolve, reject) => {
    const item = { update, send, message, resolve, reject, from: location.hash, to: then && "#" + then };
    pendingEdits.push(item);
    editVersion++;
    try {
      project();
      if (item.to) location.hash = item.to;
      render();
    } catch (err) {
      pendingEdits.pop();
      project();
      if (item.to && location.hash === item.to) location.hash = item.from;
      render();
      reject(err);
      return;
    }
    if (!sending) flushEdits();
  });
}

async function flushEdits() {
  sending = true;
  let failed = false, needsRefresh = false, message;
  while (pendingEdits.length) {
    const item = pendingEdits[0];
    let result, error;
    try { result = await item.send(); } catch (err) { error = err; }
    pendingEdits.shift();
    editVersion++;
    if (!error) {
      if (result) remember(result);
      else { item.update(serverState); needsRefresh = true; project(); }
      message = item.message;
      render();
      item.resolve();
    } else {
      failed = true;
      needsRefresh = true;
      project();
      if (item.to && location.hash === item.to) location.hash = item.from;
      render();
      item.reject(error);
    }
  }
  sending = false;
  if (!failed && message) toast(message);
  // Decisions return no snapshot; also reconcile uncertain network failures.
  if (needsRefresh) {
    try { await refresh(); render(); } catch (err) { toast(err.message); }
  }
}

// JSON merge patch: null deletes a property; arrays replace the entire value.
function mergePatch(target, patch) {
  if (!patch || typeof patch !== "object" || Array.isArray(patch)) return structuredClone(patch);
  const out = target && typeof target === "object" && !Array.isArray(target) ? { ...target } : {};
  for (const [key, value] of Object.entries(patch)) {
    if (value === null) delete out[key];
    else Object.defineProperty(out, key, { value: mergePatch(Object.hasOwn(out, key) ? out[key] : undefined, value), enumerable: true, configurable: true, writable: true });
  }
  return out;
}

function previewConfig(state, body) {
  state.view.config = mergePatch(state.view.config, body);
  for (const name of Object.keys(body.presets ?? {})) {
    const file = state.view.config.presets?.[name] ?? shippedFiles[name];
    if (!file) continue; // A shipped preset not fetched yet needs the server's resolved catalog.
    const previous = state.view.presets[name] ?? state.view.presets.custom, catalog = file.catalog ?? {};
    state.view.presets[name] = { ...previous, ...catalog, title: typeof file.title === "string" ? file.title : name,
      fields: Array.isArray(catalog.fields) ? catalog.fields : previous.fields ?? [],
      actions: catalog.actions ?? {}, operations: file.http?.operations ?? [], vocabulary: previous.vocabulary };
  }
}

const patch = run((body, then, update = () => {}) => {
  body = JSON.parse(JSON.stringify(body));
  return edit((state) => { previewConfig(state, body); update(state); }, () => api("PATCH", "/", body), { then });
});

// sync redraws only the keyed parts whose markup changed, so open details, focus and typed input elsewhere survive.
const drawn = new WeakMap();
function sync(el, parts) {
  const old = new Map([...el.children].map((c) => [c.dataset.key, c]));
  let at = el.firstElementChild;
  for (const [key, html] of parts) {
    let node = old.get(key);
    old.delete(key);
    if (!node || drawn.get(node) !== html) {
      const t = document.createElement("template");
      t.innerHTML = html;
      const fresh = t.content.firstElementChild;
      fresh.dataset.key = key;
      const disclosures = new Map([...(node?.querySelectorAll("details[data-disclosure]") ?? [])].map((d) => [d.dataset.disclosure, d.open]));
      fresh.querySelectorAll("details[data-disclosure]").forEach((d) => { d.open = disclosures.get(d.dataset.disclosure) ?? false; });
      drawn.set(fresh, html);
      node?.replaceWith(fresh);
      if (node === at) at = fresh;
      node = fresh;
    }
    if (node === at) at = at.nextElementSibling;
    else el.insertBefore(node, at);
  }
  old.forEach((c) => c.remove());
}

function render() {
  const gate = !sessionStorage.getItem(KEY) ? keyPage()
    : locked ? `<section><p>Your monitor restarted.</p><button class="primary" onclick="unlock()">Unlock</button></section>`
    : !view ? `<p class="empty">Loading…</p>` : "";
  $("gate").hidden = !gate;
  $("app").hidden = !!gate;
  sync($("gate"), gate ? [["gate", gate]] : []);
  if (gate) return;
  const [path, ...args] = route(), kind = path || "activity";
  if (kind === "agent" || kind === "account") scope = [kind, args[0]];
  if (kind === "agent-settings") scope = ["agent", args[0]];
  if (kind === "activity" || kind === "needs") {
    scope = kind === "activity" && ["agent", "account"].includes(args[0]) && args[1] ? args.slice(0, 2) : null;
  }
  if (kind !== "request") requestSource = location.hash.slice(1) || "activity";
  const panes = { request: requestPane, agent, "agent-settings": agentSettings, pair, account, add, preset: presetPage, rules, settings, integrations };
  const parts = (html) => html.map((content, i) => [`${location.hash}/${i}`, content]).filter(([, content]) => content);
  $("app").classList.toggle("with-pane", !!panes[kind]);
  $("list").setAttribute("role", panes[kind] ? "complementary" : "main");
  $("pane").hidden = !panes[kind];
  sync($("tree"), sidebar(kind, args[0]));
  sync($("list"), list(kind === "request" && args[0]));
  sync($("pane"), panes[kind] ? parts(panes[kind](...args)) : []);
  liveSync();
}

const head = (title, sub = "", back = "activity") => `<header><b>${title}</b><span class="muted">${sub}</span><a class="x" href="#${esc(back)}" aria-label="Close">✕</a></header>`;
const disclosure = (key, title, content, cls = "") => `<details data-disclosure="${esc(key)}" class="${cls}"><summary>${title}</summary>${content}</details>`;
const node = (key, attrs, label, depth, { open, count = "", on } = {}) => [key,
  `<a class="node ${on ? "on" : ""}" ${attrs} style="--depth: ${depth}"><i>${open == null ? "" : open ? "▾" : "▸"}</i><span>${label}</span><small>${count}</small></a>`];
const folder = (key, label, count, depth = 0) => node(key,
  `role="button" tabindex="0" aria-expanded="${expanded.has(key)}" onclick="toggle(${q(key)})" onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); toggle(${q(key)}); }"`,
  label, depth, { open: expanded.has(key), count });
const link = (path, label, depth, on, count) => node(path.join("/"), `href="#${path.map(encodeURIComponent).join("/")}"`, label, depth, { on, count });

function toggle(key) {
  expanded.has(key) ? expanded.delete(key) : expanded.add(key);
  render();
}

function sidebar(kind, arg) {
  const pending = pendingSoonest(), at = (k, a) => kind === k && arg === a;
  const presets = Object.entries(view.presets).sort(([, a], [, b]) => a.title.localeCompare(b.title));
  const custom = ["custom_api", "mcp"].filter((name) => view.presets[name]);
  const groups = new Map(Object.keys(CATALOG_GROUPS).map((g) => [g, []]));
  for (const preset of presets) {
    const group = preset[1].group ?? "api";
    if (!groups.has(group)) groups.set(group, []);
    groups.get(group).push(preset);
  }
  for (const entries of groups.values()) entries.sort(([a], [b]) => Number(custom.includes(b)) - Number(custom.includes(a)));
  const saved = Object.values(ids()).reduce((n, id) => n + (id.rules?.length ?? 0), 0);
  return [
    node("needs", `href="#needs"`, `${pending.length ? `<span class="bang">!</span> ` : ""}Approvals`, 0,
      { count: pending.length || "", on: kind === "needs" || kind === "request" && requestSource === "needs" }),
    folder("agents", "Agents", Object.keys(ids()).length),
    ...(expanded.has("agents") ? [...Object.keys(ids()).map((n) => link(["agent", n], `${pending.some((r) => r.facts.principal.name === n) ? `<span class="bang">!</span> ` : ""}${esc(n)}`, 1,
      at("agent", n) || at("agent-settings", n))), link(["pair"], `<span class="new">Pair agent…</span>`, 1, kind === "pair")] : []),
    folder("accounts", "Accounts", Object.keys(accounts()).length),
    ...(expanded.has("accounts") ? Object.keys(accounts()).map((a) => link(["account", a], accountIcon(a) + esc(a), 1, at("account", a), accountStatus(a))) : []),
    folder("add", "Add account", presets.length),
    ...(expanded.has("add") ? [...[...groups].filter(([, entries]) => entries.length).flatMap(([group, entries]) => [
      folder("add-group/" + group, esc(CATALOG_GROUPS[group] ?? group), entries.length, 1),
      ...(expanded.has("add-group/" + group) ? entries.map(([t, c]) => link(["add", t], connectorIcon(t) + esc(c.title), 2, at("add", t),
        Object.keys(accounts()).filter((a) => entry(a) === c).length || "")) : []),
    ]), link(["preset"], `<span class="new">New preset…</span>`, 1, kind === "preset" && !arg)] : []),
    link(["rules"], "Rules", 0, kind === "rules", saved || ""),
    link(["activity"], "Activity", 0, kind === "activity" || kind === "request" && requestSource.startsWith("activity")),
    link(["integrations"], "Integrations", 0, kind === "integrations"),
    link(["settings"], "Settings", 0, kind === "settings"),
  ];
}

function keyPage() {
  return `<section><label>Owner key</label><input id="key" type="password"><div class="row"><span></span><button class="primary" onclick="setKey()">Continue</button></div></section>`;
}

const setKey = run(async () => {
  sessionStorage.setItem(KEY, $("key").value.trim());
  await refresh();
  render();
});

const unlock = run(async () => {
  remember(await api("POST", "/unlock", { generation: +localStorage.getItem(GENERATION) || 0 }));
  await refresh();
  render();
});

function summary(e) {
  if (e?.message) return `${e.message.from} → ${e.message.to}`;
  if (e?.http) return `${e.http.method} ${e.http.host}${e.http.path}`;
  if (e?.smtp) return `To ${e.smtp.to.join(", ")}${e.mail?.subject ? `: ${e.mail.subject}` : ""}`;
  if (e?.imap) return `${e.imap.command} ${e.imap.args}`;
  if (e?.mcp) return e.mcp.tool;
  return "";
}

function reasons(r) {
  const messages = new Map((r.reasons ?? []).map((reason) => [reason.id, reason.message]));
  return (r.gaps ?? r.waives ?? []).map((id) => messages.get(id) ?? id);
}

// A saved approval binds one operation and its grant. The text names fields, not values, which can be whole messages;
// fields left out of the grant are named as broad.
function grantText(operation, grant, scope) {
  const fields = Object.keys(grant ?? {}), broad = Object.keys(scope ?? {}).filter((k) => !fields.includes(k));
  return `Allow ${operation} ${fields.length ? "for the same " + fields.join(", ") : "for any request"}`
    + (fields.length && broad.length ? `, with any ${broad.join(", ")}` : "");
}
const saveText = (r) => grantText(r.facts?.operation?.id, r.grant, r.facts?.parameters);
const saveButton = (r, text, primary) => r.facts?.operation?.action == null || !r.facts?.operation?.id ? ""
  : `<button class="${primary ? "primary" : ""}" title="${esc(saveText(r))}" onclick="answer('${r.id}', 'save')">${esc(text)}</button>`;
const decide = (r, saveLabel) => r.savingDecision ? "" : r.state === "pending"
  ? `<button onclick="answer('${r.id}', 'once')">Allow once</button>${saveButton(r, saveLabel, true)}<button class="danger" onclick="answer('${r.id}', 'deny')">Deny</button>`
  : r.state === "expired" ? `${saveButton(r, saveLabel)}<button onclick="dismiss('${r.id}')">Dismiss</button>` : "";

function list(selected) {
  const dismissed = JSON.parse(localStorage.getItem(DISMISSED) ?? "[]");
  const pending = pendingSoonest(), expired = records.filter((r) => r.state === "expired" && !dismissed.includes(r.id));
  const shown = records.filter((r) => !scope || (scope[0] === "agent" ? r.facts.principal.name : r.facts.account) === scope[1]);
  const queued = (r) => ["q/" + r.id, `<a class="q ${r.id === selected ? "on" : ""}" href="#request/${r.id}"><span class="bang">${r.state === "pending" ? "!" : ""}</span><span>${esc(r.facts.principal.name)}</span>
    <span><span class="muted">${accountIcon(r.facts.account)}${esc(r.facts.account)}</span> <b class="mono">${esc(r.facts?.title || summary(r.facts?.details))}</b></span>
    <span class="mono ${STATE_CLASS[r.state]}">${r.state === "pending" ? left(r) : "expired"}</span></a>`];
  return [
    ["needs", `<div class="group">${pending.length ? `<span class="bang">!</span><b>Approvals</b><span class="muted">${pending.length}</span>` : `<b>Approvals</b><span class="muted">Nothing pending</span>`}</div>`],
    ...pending.map(queued),
    ...(expired.length ? [["expired", `<div class="group"><b>Expired</b><span class="muted">${expired.length}</span></div>`], ...expired.map(queued)] : []),
    ["activity", `<div class="group"><b>Activity</b>${scope ? `<span class="muted">${esc(scope[1])} · <a href="#activity">All</a></span>` : ""}</div>`],
    ["columns", `<div class="ev hd"><span>Time</span><span>Agent</span><span>Account</span><span>Operation</span><span>Result</span></div>`],
    ...shown.map((r) => ["e/" + r.id, `<a class="ev ${r.id === selected ? "on" : ""}" href="#request/${r.id}"><span class="mono muted">${new Date(r.time).toLocaleTimeString()}</span>
      <span>${esc(r.facts.principal.name)}</span><span>${accountIcon(r.facts.account)}${esc(r.facts.account)}</span><span class="mono">${esc(r.facts?.title || summary(r.facts?.details))}</span><span class="${STATE_CLASS[r.state]}">${r.state}</span></a>`]),
    ...(shown.length ? [] : [["quiet", `<p class="empty">Nothing yet.</p>`]]),
  ];
}

function requestPane(id) {
  const r = records.find((r) => r.id === id);
  if (!r) return [head("Request", "", requestSource), `<p class="empty">No request ${esc(id)}.</p>`];
  const buttons = decide(r, saveText(r));
  return [head(esc(r.facts?.title || summary(r.facts?.details) || r.facts.account), `${esc(r.facts.principal.name)} · ${accountIcon(r.facts.account)}${esc(r.facts.account)}${r.state === "pending" ? ` · ${left(r)} left` : ""}`, requestSource),
    `<section><div class="row"><span class="${STATE_CLASS[r.state]}">${r.state}</span><span class="muted">${new Date(r.time).toLocaleTimeString()}</span></div>
      <ul>${[...(r.deny ?? []), ...reasons(r)].map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
      <div class="mono">${esc(summary(r.facts?.details))}</div>
      ${r.facts?.operation?.id ? disclosure("grant", `<span class="muted">${esc(r.facts?.operation?.id)} grant</span>`, `<pre>${esc(JSON.stringify(r.grant))}</pre>`) : ""}
      ${disclosure("request", "Policy facts", `<pre>${esc(JSON.stringify(r.facts, null, 2))}</pre>`)}
      ${draftLink(r) ? `<div class="row">${draftLink(r)}</div>` : ""}${buttons ? `<div class="decisions">${buttons}</div>` : ""}</section>`];
}

const answer = run((id, decision) => {
  const request = records.find((r) => r.id === id);
  if (!request || request.savingDecision) return;
  return edit((state) => {
    state.records = state.records.map((r) => r.id === id ? { ...r, savingDecision: true,
      state: r.state === "pending" ? decision === "deny" ? "denied" : "approved" : r.state } : r);
    const identity = state.view.config.identities?.[request.facts.principal.name];
    if (decision === "save" && identity) identity.rules = [...(identity.rules ?? []), {
      account: request.facts.account, action: request.facts.operation.action, operation: request.facts.operation.id,
      definition: request.definition,
      scope: request.grant ?? {}, waives: request.gaps ?? [], reasons: request.reasons ?? [],
    }];
  }, () => api("POST", `/requests/${id}`, { decision }), { message: decision === "save" ? "Rule saved" : decision === "deny" ? "Denied" : "Approved" });
});

function dismiss(id) {
  localStorage.setItem(DISMISSED, JSON.stringify([...JSON.parse(localStorage.getItem(DISMISSED) ?? "[]"), id]));
  render();
}

function labelStatus(l) {
  const lines = [lattices().confidentiality && l?.audience && l.audience !== "anyone" && `Has seen private data${l.because?.audience ? ` from ${l.because.audience}` : ""}`, lattices().integrity && l?.trust === "untrusted" && "Has read content from strangers"];
  return lines.filter(Boolean).join(" · ") || "Clean";
}

const pair = () => [head("Pair an agent"), `<section><label>Name</label><input id="name"><label>Public key</label><textarea id="pubkey" rows="3"></textarea>
  <div class="row"><span></span><button class="primary" onclick="pairAgent()">Pair</button></div></section>`];

const pairAgent = () => patch({ identities: { [$("name").value.trim()]: { key: $("pubkey").value.trim(), accounts: {} } } }, "agent/" + encodeURIComponent($("name").value.trim()));

function ruleSentence(r) {
  if (!r.operation) return `Inactive: ${r.action} on ${r.account} was saved before approvals named an operation`;
  return `${grantText(r.operation, r.scope, r.scope)} on ${r.account}. Approval covers: ${reasons(r).join(" ")}`;
}

// mode mirrors lib.rego: the most specific override wins, effects that ask still ask at allow,
// effects without change are allowed and the rest follow the level.
function mode(access, vocabulary, effects, k) {
  const lineage = k.split(".").map((_, i, p) => p.slice(0, p.length - i).join("."));
  const has = (name) => effects.some((e) => vocabulary[e]?.[name]);
  return lineage.map((a) => access.actions?.[a]).find(Boolean)
    ?? (access.level === "allow" && has("ask") ? "ask" : has("change") ? (access.level === "read" ? "off" : access.level) : "allow");
}

function accessActions(name, a, access) {
  const c = entry(a);
  const renderAction = (node) => {
    const k = node.key, effects = effectsOf(a, k), children = [...node.children.values()];
    const inherited = mode({ ...access, actions: { ...access.actions, [k]: null } }, c.vocabulary, effects, k), own = access.actions?.[k];
    const overrides = Object.keys(access.actions ?? {}).filter((action) => action.startsWith(k + ".") && access.actions[action]).length;
    const label = `${esc(node.title)}${overrides ? ` <small class="muted" title="${overrides} overrides">${overrides}</small>` : ""}`;
    const buttons = `<span class="seg" role="group" aria-label="${esc(k)} permission">${Object.entries(MODES).map(([m, t]) =>
      `<button class="${m === own ? "primary" : !own && m === inherited ? "inherited" : ""}" aria-label="${esc(t + " " + k)}" aria-pressed="${m === own}" onclick="event.preventDefault(); event.stopPropagation(); patchAccess(${q(name)}, ${q(a)}, { actions: { [${q(k)}]: ${q(m === own ? null : m)} } })">${t}</button>`).join("")}</span>`;
    const title = `title="${esc(effects.join(", "))}"`;
    return children.length
      ? `<details class="access-action-group" data-disclosure="${esc(name + "/" + a + "/" + k)}"><summary class="access-action" role="button" aria-label="${esc(node.title)}"><span class="access-group-title" ${title}>${label}</span>${buttons}</summary><div class="access-children">${children.map(renderAction).join("")}</div></details>`
      : `<div class="access-action"><span ${title}>${label}</span>${buttons}</div>`;
  };
  return actionTree(a).map(renderAction);
}

function agent(name) {
  const id = ids()[name];
  if (!id) return [head(esc(name)), `<p class="empty">No agent ${esc(name)}.</p>`];
  const levels = Object.entries(accounts()).map(([a, acc]) => {
    const access = id.accounts?.[a] ?? { level: "off" };
    const c = entry(a);
    const actions = access.level === "off" ? [] : accessActions(name, a, access);
    const overrides = Object.values(access.actions ?? {}).filter(Boolean).length;
    const key = `access/${encodeURIComponent(name)}/${encodeURIComponent(a)}`, open = actions.length > 0 && expanded.has(key);
    return `<div class="acct"><div class="row"><button class="access-toggle" aria-label="Actions for ${esc(a)}" aria-expanded="${open}" aria-controls="${esc(key)}" ${actions.length ? "" : "disabled"} onclick="toggle(${q(key)})">
      <i>${actions.length ? open ? "▾" : "▸" : ""}</i>${accountIcon(a)}<b>${esc(a)}</b>${overrides && access.level !== "off" ? `<small class="muted" title="${overrides} action overrides" aria-label="${overrides} action overrides">${overrides}</small>` : ""}</button>
      <span class="seg" role="group" aria-label="Default access for ${esc(a)}">${Object.entries(LEVELS).filter(([l]) => acc.preset !== "custom_api" || l !== "read").map(([l, t]) =>
        `<button class="${l === access.level ? "primary" : ""}" aria-pressed="${l === access.level}" onclick="patchAccess(${q(name)}, ${q(a)}, { level: ${q(l)} })">${t}</button>`).join("")}</span></div>
      <div class="access-actions" id="${esc(key)}" ${open ? "" : "hidden"}>${actions.join("")}</div></div>`;
  });
  const reaches = (pred) => Object.entries(accounts()).some(([a, acc]) => (id.accounts?.[a]?.level ?? "off") !== "off" && pred(acc));
  const hint = lattices().confidentiality && reaches((acc) => acc.preset === "web") && reaches((acc) => acc.contents !== "anyone")
    ? `<p class="muted">Browsing needs approval after reading private data.</p>` : "";
  const others = Object.keys(ids()).filter((n) => n !== name);
  const l = view.labels[name] ?? {};
  const point = (axis, values) => {
    const lattice = axis === "trust" ? "integrity" : "confidentiality";
    if (!lattices()[lattice]) return `<a class="muted" href="#settings">${axis === "trust" ? "Integrity" : "Confidentiality"} off</a>`;
    return `<select aria-label="${axis === "trust" ? "Trust" : "Audience"}" onchange="setLabel(${q(name)}, { ...${q({ trust: l.trust, audience: l.audience })}, [${q(axis)}]: this.value })">
      ${Object.entries(values).map(([v, title]) => opt(v, title, l[axis])).join("")}</select>`;
  };
  return [head(esc(name), `<span class="labels" title="${esc(labelStatus(l))}">${point("trust", { trusted: "Trusted", untrusted: "Untrusted" })}${point("audience", WHO)}</span>`),
    id.profile || hint ? `<section>${id.profile ? `<p class="warn">Profiling is on. Requests run without checks.</p>` : ""}${hint}</section>` : "",
    `<section><h2>Access</h2>${levels.join("") || `<p class="empty">No accounts yet.</p>`}</section>`,
    messageSettings(name, others),
    `<section><a href="#agent-settings/${encodeURIComponent(name)}">Settings</a></section>`];
}

function agentSettings(name) {
  if (!ids()[name]) return [head(esc(name)), `<p class="empty">No agent ${esc(name)}.</p>`];
  const others = Object.keys(ids()).filter((n) => n !== name);
  return [head(esc(name), "Settings", "agent/" + encodeURIComponent(name)),
    `<section><a href="#integrations">Connect your tools</a><p class="muted">Setup guides for wrapped commands, Monitor shell, and the MCP gateway.</p></section>`,
    `<section>${disclosure("setup", "Setup", `<label>Host key</label><pre>${esc(view.host_key)}</pre><label>CA</label><pre>${esc(view.ca)}</pre><label>Environment</label><pre>${esc(view.setup[name]) || "No secrets to substitute."}</pre>`)}</section>`,
    `<section>${disclosure("replace-key", "Replace key", `<p class="muted">Use this after recreating the sandbox. The agent starts clean.</p><textarea id="pubkey" rows="2"></textarea>
      <div class="row"><span></span><button onclick="patch({ identities: { [${q(name)}]: { key: $('pubkey').value.trim() } } })">Replace key</button></div>`)}</section>`,
    others.length ? `<section>${disclosure("copy-settings", "Copy settings", `<div class="row"><select id="from">${others.map((n) => opt(n, n)).join("")}</select><button onclick="copySettings(${q(name)})">Copy</button></div>`)}</section>` : "",
    `<section><button class="danger" onclick="removeAgent(${q(name)})">Remove agent</button></section>`];
}

function rulesSection(name) {
  const list = (ids()[name].rules ?? []).map((r, i) => `<div class="row"><span>${esc(ruleSentence(r))}${r.operation
    ? `<details><summary class="muted">grant</summary><pre>${esc(JSON.stringify(r.scope))}</pre></details>` : ""}</span><button onclick="removeRule(${q(name)}, ${i})">Remove</button></div>`);
  return `<section><h2>${esc(name)}</h2>${list.join("")}</section>`;
}

const rules = () => [head("Rules"), ...Object.keys(ids()).filter((n) => ids()[n].rules?.length).map(rulesSection)];

function messageSettings(name, peers) {
  if (!peers.length) return "";
  const messages = ids()[name].messages ?? {};
  return `<section>${disclosure("messages", "Messages", `<p class="muted">Both agents must allow a channel. Changing its limits or revoking it clears queued messages.</p>
    <table><tr><th>Agent</th><th>May send to</th><th>Receive audience</th><th>Receive trust</th></tr>${peers.map((peer) => {
      const limit = messages.receive?.[peer];
      return `<tr><td>${esc(peer)}</td><td><input type="checkbox" ${messages.send?.includes(peer) ? "checked" : ""} onchange="setMessageSend(${q(name)}, ${q(peer)}, this.checked)"></td>
        <td><select onchange="setMessageReceive(${q(name)}, ${q(peer)}, 'audience', this.value)">${["off", "anyone", "team", "me"].map((v) => opt(v, v, limit?.audience ?? "off")).join("")}</select></td>
        <td><select ${limit ? "" : "disabled"} onchange="setMessageReceive(${q(name)}, ${q(peer)}, 'trust', this.value)">${["trusted", "untrusted"].map((v) => opt(v, v, limit?.trust ?? "trusted")).join("")}</select></td></tr>`;
    }).join("")}</table>`)}</section>`;
}

const setMessageSend = (name, peer, enabled) => {
  const send = (ids()[name].messages?.send ?? []).filter((p) => p !== peer);
  if (enabled) send.push(peer);
  return patch({ identities: { [name]: { messages: { send } } } });
};

const setMessageReceive = (name, peer, axis, value) => patch({ identities: { [name]: { messages: { receive: {
  [peer]: value === "off" ? null : { audience: "anyone", trust: "trusted", ...ids()[name].messages?.receive?.[peer], [axis]: value },
} } } } });

const removeAgent = (name) => patch({ identities: Object.fromEntries(Object.entries(ids()).map(([peer, id]) => [peer,
  peer === name ? null : { messages: id.messages ? { send: (id.messages.send ?? []).filter((p) => p !== name), receive: { [name]: null } } : null },
])) }, "activity");

const patchAccess = (name, account, access) => patch({ identities: { [name]: { accounts: { [account]: access } } } });

const setLabel = run((name, label) => edit((state) => {
  state.view.labels[name] = { ...label, because: {
    ...(label.trust !== "trusted" && { trust: "the owner" }),
    ...(label.audience !== "anyone" && { audience: "the owner" }),
  } };
}, () => api("POST", "/labels/" + encodeURIComponent(name), label)));

const removeRule = (name, i) => patch({ identities: { [name]: { rules: ids()[name].rules.filter((_, j) => j !== i) } } });

// Explicit deletions replace the nested account map in one atomic merge patch.
const copySettings = (name) => {
  const from = ids()[$("from").value];
  return patch({ identities: { [name]: { accounts: changes(ids()[name].accounts, from.accounts ?? {}), rules: from.rules ?? [] } } });
};

const mcpKeys = (a) => Object.entries(accounts()[a].connections ?? {}).filter(([, kinds]) => kinds.mcp).map(([key]) => key);
const connName = (a, key) => (key ? `${a}-${key}` : a);

function accountStatus(a) {
  const states = mcpKeys(a).map((k) => view.status[connName(a, k)] ?? {});
  if (states.some((s) => s.error)) return `<span class="bad">Can't connect</span>`;
  if (states.some((s) => s.state === "connecting")) return `<span class="muted">Connecting…</span>`;
  const blocked = states.reduce((n, s) => n + (s.blocked ?? 0), 0);
  return blocked ? `<span class="warn">${blocked} tools await review</span>` : "";
}

// Shipped preset files, fetched as written so an owner's copy keeps their order and environment references.
const shippedFiles = {};
const loadShipped = run(async (name) => {
  shippedFiles[name] = await api("GET", "/presets/" + encodeURIComponent(name));
  render();
});
// The owner's version of a preset, else the shipped file once fetched, else a new preset.
const presetFile = (name) => view.config.presets?.[name] ?? shippedFiles[name] ?? (view.presets[name] ? undefined : { title: name, ...NEW_PRESET });

// Preset files keep one field, action and operation per line, as the shipped files do.
const EXPANDED = ["", "catalog", "catalog.fields", "catalog.actions", "http", "http.operations"];
const compact = (v) => Array.isArray(v) ? `[${v.map(compact).join(", ")}]`
  : v && typeof v === "object" ? `{${Object.entries(v).map(([k, x]) => `${JSON.stringify(k)}: ${compact(x)}`).join(", ")}}` : JSON.stringify(v);
function presetText(v, path = "", indent = "") {
  if (!EXPANDED.includes(path) || v === null || typeof v !== "object") return compact(v);
  const [open, close, items] = Array.isArray(v) ? ["[", "]", v.map((x) => presetText(x, path + ".*", indent + "  "))]
    : ["{", "}", Object.entries(v).map(([k, x]) => `${JSON.stringify(k)}: ${presetText(x, path ? `${path}.${k}` : k, indent + "  ")}`)];
  return items.length ? `${open}\n${indent}  ${items.join(`,\n${indent}  `)}\n${indent}${close}` : open + close;
}

// Downloads the saved version, which the monitor has checked, as presets/<name>.json.
function downloadPreset(name) {
  const blob = new Blob([presetText(presetFile(name)) + "\n"], { type: "application/json" });
  Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: name + ".json" }).click();
}

// An unmatched request on a preset's account can become one of its operations.
const draftLink = (r) => r.facts?.operation == null && r.facts?.details?.http && accounts()[r.facts.account] && Array.isArray(entry(r.facts.account).operations)
  ? `<a href="#preset/${encodeURIComponent(accounts()[r.facts.account].preset)}/${r.id}">Add operation</a>` : "";

// The draft matches only this exact path; the owner turns segments into {parameters} and sets its effects and scope.
function draftOperation(e) {
  const h = e.http, read = ["GET", "HEAD"].includes(h.method), params = Object.keys(h.query ?? {});
  return { id: `${h.method} ${h.path}`, action: read ? "read" : "write", effects: [read ? "read" : "write"], method: h.method, origin: h.origin, path: h.path,
    ...(params.length && { params }), ...(h.body_kind !== "none" && { body: ["json", "form"].includes(h.body_kind) ? h.body_kind : "any" }),
    ...(e.graphql?.fields?.length === 1 && { body: "graphql", graphql: { operation: e.graphql.kind, field: e.graphql.fields[0].name } }), scope: {} };
}

function presetPage(name, from) {
  if (!name) return [head("New preset"), `<section><label>Name</label><div class="row"><input id="preset-name"><button onclick="location.hash = 'preset/' + encodeURIComponent($('preset-name').value.trim())">Create</button></div></section>`];
  if (!presetFile(name)) {
    loadShipped(name);
    return [head("Preset " + esc(name)), `<p class="empty">Loading…</p>`];
  }
  const file = structuredClone(presetFile(name)), r = records.find((r) => r.id === from);
  if (r?.facts?.details?.http) file.http = { ...file.http, operations: [...(file.http?.operations ?? []), draftOperation(r.facts.details)] };
  const users = Object.entries(accounts()).filter(([, acc]) => acc.preset === name).map(([a]) => a);
  return [head("Preset " + esc(name)), `<section><p class="muted">Changes apply to every account using it: ${esc(users.join(", ") || "none yet")}.</p>
    <textarea id="preset" rows="40">${esc(presetText(file))}</textarea>
    <div class="row">${view.config.presets?.[name] ? `<button class="danger" onclick="patch({ presets: { [${q(name)}]: null } })">Remove your version</button>` : "<span></span>"}
      <span><button onclick="downloadPreset(${q(name)})">Download file</button> <button class="primary" onclick="savePreset(${q(name)})">Save</button></span></div></section>`];
}

const savePreset = run(async (name) => {
  await patch({ presets: { [name]: changes(view.config.presets?.[name], JSON.parse($("preset").value)) } }, "preset/" + encodeURIComponent(name));
});

function questions(a) {
  const pick = (id, value) => `<select id="${id}">${AUDIENCES.map((x) => opt(x, WHO[x], value)).join("")}</select>`;
  return `<label for="contents">Who should see what's in here?</label>${pick("contents", a.contents)}
    <label><input type="checkbox" id="strangers" ${a.strangers ? "checked" : ""}> Strangers can put content here</label>
    <label for="sends">Who sees what the agent sends here?</label>${pick("sends", a.sends)}`;
}

const answers = () => ({ contents: $("contents").value, strangers: $("strangers").checked, sends: $("sends").value });

function input(f, value, disabled = false) {
  const state = disabled ? "disabled" : "";
  if (f.json) value = value === undefined ? "" : JSON.stringify(value, null, 2);
  if (f.json || f.multiline) return `<textarea id="f-${esc(f.key)}" ${state} rows="6">${esc(value)}</textarea>`;
  if (f.secret) return `<div class="secret-input"><input id="f-${esc(f.key)}" ${state} type="password" autocomplete="new-password" spellcheck="false" placeholder="${esc(f.hint || "Paste your secret here")}" value="${esc(value)}">
    <button type="button" aria-controls="f-${esc(f.key)}" aria-pressed="false" aria-label="Show ${esc(f.label)}" onclick="toggleSecret(${q(f.key)}, this)">Show</button></div>`;
  return `<input id="f-${esc(f.key)}" ${state} type="text" placeholder="${esc(f.hint)}" value="${esc(f.list ? (value ?? []).join(", ") : value)}">`;
}

function toggleSecret(key, button) {
  const field = $("f-" + key), show = field.type === "password";
  field.type = show ? "text" : "password";
  button.textContent = show ? "Hide" : "Show";
  button.setAttribute("aria-pressed", String(show));
  button.setAttribute("aria-label", button.getAttribute("aria-label").replace(/^(Show|Hide)/, button.textContent));
}

function read(f) {
  const raw = $("f-" + f.key).value;
  const v = f.secret ? raw : raw.trim();
  if (f.json) return v ? JSON.parse(v) : {};
  return f.list ? v.split(/[\s,]+/).filter(Boolean) : v;
}

const atPath = (object, path) => path.reduce((value, key) => value?.[key], object);
function putPath(object, path, value) {
  for (const key of path.slice(0, -1)) {
    if (!Object.hasOwn(object, key)) Object.defineProperty(object, key, { value: {}, enumerable: true });
    object = object[key];
  }
  Object.defineProperty(object, path.at(-1), { value, enumerable: true, configurable: true, writable: true });
}
const paths = (f) => f.paths ?? [f.path];
const fieldsOf = (c) => c.fields ?? [];
// A field with no paths, such as an OAuth client ID, only fills the account's templates when it is created.
const plain = (c) => fieldsOf(c).filter((f) => !f.secret && paths(f).length);
const fieldValue = (acc, f) => atPath(acc, f.path ?? paths(f)[0]) ?? (f.list ? [] : f.json ? {} : "");
// A merge patch replaces an array whole, so a setting inside one, such as a slot's origin, rewrites a copy of its array.
function putSetting(update, acc, path, value) {
  const n = path.findIndex((_, i) => i > 0 && Array.isArray(atPath(acc, path.slice(0, i))));
  if (n < 0) return putPath(update, path, value);
  const list = atPath(update, path.slice(0, n)) ?? JSON.parse(JSON.stringify(atPath(acc, path.slice(0, n))));
  path.slice(n, -1).reduce((o, k) => o[k], list)[path.at(-1)] = value;
  putPath(update, path.slice(0, n), list);
}
const filled = (c, values) => JSON.parse(JSON.stringify(c), (_, v) => typeof v === "string" ? fill(v, values) : v);

// Used for the custom JSON editor so removed settings become explicit deletions.
function changes(before, after) {
  if (JSON.stringify(before) === JSON.stringify(after)) return undefined;
  if (after === null || typeof after !== "object" || Array.isArray(after)) return after;
  return Object.fromEntries([...new Set([...Object.keys(before ?? {}), ...Object.keys(after)])]
    .map((key) => [key, Object.hasOwn(after, key) ? changes(before?.[key], after[key]) : null])
    .filter(([, value]) => value !== undefined));
}

function setupField(f, preset) {
  const field = `<label for="f-${esc(f.key)}">${esc(f.oauth ? "Access token" : f.label)}</label>${input(f.oauth ? { ...f, label: "Access token", hint: "Paste your access token here" } : f, f.default)}
    ${f.secret ? `<p class="muted field-help">Leave blank to configure later.</p>` : ""}`;
  if (!f.oauth) return field;
  return `<div class="credential"><div id="token-field-${esc(f.key)}" hidden>${field}</div>
    <button type="button" class="link" id="token-toggle-${esc(f.key)}" aria-controls="token-field-${esc(f.key)}" aria-expanded="false" onclick="setupToken(${q(preset)}, ${q(f.key)})">Use an access token instead</button></div>`;
}

function setupToken(preset, key) {
  const field = $("token-field-" + key), button = $("token-toggle-" + key);
  field.hidden = !field.hidden;
  button.textContent = field.hidden ? "Use an access token instead" : "Use sign-in instead";
  button.setAttribute("aria-expanded", String(!field.hidden));
  $("signin-" + key).hidden = !field.hidden;
  const oauth = fieldsOf(view.presets[preset]).some((f) => !f.edit_only && f.oauth && $("token-field-" + f.key).hidden);
  $("account-add").textContent = oauth ? "Add without signing in" : "Add";
  $("account-add").classList.toggle("primary", !oauth);
  if (!field.hidden) $("f-" + key).focus();
}

const signInLabel = (preset) => preset === "mcp" || !view.presets[preset] ? "Sign in" : "Sign in with " + view.presets[preset].title;

function add(preset) {
  const c = view.presets[preset];
  if (!c) return [head("Add account"), `<p class="empty">No preset ${esc(preset)}.</p>`];
  if (preset === "custom_api") return customAPIPage(c);
  const fields = fieldsOf(c).filter((f) => !f.edit_only), oauth = fields.filter((f) => f.oauth);
  return [head(connectorIcon(preset) + "Add " + esc(c.title)), `<section><label for="account-name">Name</label><input id="account-name" value="${esc(preset)}">
    ${fields.map((f) => setupField(f, preset)).join("")}
    ${questions(c.defaults)}<div class="row"><span></span><div class="credential-actions">
      <button id="account-add" class="${oauth.length ? "" : "primary"}" onclick="addAccount(${q(preset)})">${oauth.length ? "Add without signing in" : "Add"}</button>
      ${oauth.map((f) => `<button id="signin-${esc(f.key)}" class="primary" onclick="addAccount(${q(preset)}, ${q(f.key)})">${esc(signInLabel(preset))}</button>`).join("")}</div></div></section>`,
    `<section><a href="#preset/${encodeURIComponent(preset)}">Edit preset</a></section>`];
}

const addAccount = run(async (preset, signInKey) => {
  if ($("account-add").disabled) return;
  const c = view.presets[preset], name = $("account-name").value.trim();
  if (!name) throw new Error("Name this account.");
  if (Object.hasOwn(accounts(), name)) throw new Error("An account with that name already exists. Choose another name.");
  const fields = fieldsOf(c).filter((f) => !f.edit_only);
  const values = Object.fromEntries(fields.map((f) => [f.key, read(f)]));
  // Only the non-secret values fill a preset's connections; secrets go to their fields' paths.
  const plainValues = Object.fromEntries(fields.filter((f) => !f.secret).map((f) => [f.key, values[f.key]]));
  const acc = { preset, ...answers(),
    connections: c.connections ? filled(c.connections, plainValues) : values.connections };
  for (const f of fields) {
    const value = f.oauth && $("token-field-" + f.key).hidden ? { oauth: filled(f.oauth, values) }
      : f.secret && values[f.key] === "" ? null : values[f.key];
    for (const path of paths(f)) putPath(acc, path, value);
  }
  const body = { accounts: { [name]: acc } }, from = location.hash;
  const buttons = [$("account-add"), ...fields.filter((f) => f.oauth).map((f) => $("signin-" + f.key))];
  buttons.forEach((button) => { button.disabled = true; });
  try {
    await edit((state) => previewConfig(state, body), () => api("PATCH", "/", body), { message: "Account added" });
    if (location.hash !== from) return;
    location.hash = "account/" + encodeURIComponent(name);
    if (signInKey !== undefined) {
      const f = fields.find((f) => f.key === signInKey);
      await signIn(name, paths(f)[0].map(encodeURIComponent).join("/"));
    }
  } finally { buttons.forEach((button) => { button.disabled = false; }); }
});

function apiConnectionFields(slot = {}) {
  const auth = slot.query ? "query" : slot.header && !(slot.header.toLowerCase() === "authorization" && slot.prefix === "Bearer ") ? "header" : "bearer";
  const url = slot.origin ? slot.origin + (slot.path === "/" ? "" : slot.path ?? "") : "";
  return `<label for="api-url">API URL</label><input id="api-url" type="url" required placeholder="https://api.example.com" value="${esc(url)}" autocomplete="off">
    <p class="muted">The credential is used only at this address and its paths.</p>
    <label for="api-auth">Authentication</label><select id="api-auth" onchange="apiAuthChanged()">${opt("bearer", "Bearer token", auth)}${opt("header", "API key in a header", auth)}${opt("query", "API key in a query parameter", auth)}</select>
    <div id="api-header-fields" ${auth === "header" ? "" : "hidden"}><label for="api-header">Header name</label><input id="api-header" value="${esc(auth === "header" ? slot.header : "X-API-Key")}">
      <label for="api-prefix">Prefix, if required</label><input id="api-prefix" value="${esc(auth === "header" ? slot.prefix : "")}" placeholder="Leave empty for a plain API key"></div>
    <div id="api-query-fields" ${auth === "query" ? "" : "hidden"}><label for="api-query">Parameter name</label><input id="api-query" value="${esc(slot.query ?? "api_key")}"></div>`;
}

function apiAuthChanged() {
  $("api-header-fields").hidden = $("api-auth").value !== "header";
  $("api-query-fields").hidden = $("api-auth").value !== "query";
}

function readAPISlot(value = "token") {
  let url;
  try { url = new URL($("api-url").value.trim()); } catch { throw new Error("Enter the API's HTTPS URL, such as https://api.example.com."); }
  if (url.protocol !== "https:" || url.port === "80" || url.username || url.password || url.search || url.hash) {
    throw new Error("Use an HTTPS URL without credentials, query parameters, or a fragment.");
  }
  const slot = { value, origin: url.origin, path: url.pathname.replace(/\/+$/, "") || "/" };
  switch ($("api-auth").value) {
    case "bearer": return { ...slot, header: "Authorization", prefix: "Bearer " };
    case "header": {
      const header = $("api-header").value.trim(), prefix = $("api-prefix").value;
      if (!/^[!#$%&'*+.^_`|~0-9a-z-]+$/i.test(header)) throw new Error("Enter a valid header name, such as X-API-Key.");
      if (/[\r\n]/.test(prefix)) throw new Error("The header prefix must be on one line.");
      return { ...slot, header, ...(prefix ? { prefix } : {}) };
    }
    case "query": {
      const query = $("api-query").value.trim();
      if (!query || /[\s&=#?]/.test(query)) throw new Error("Enter a query parameter name, such as api_key.");
      return { ...slot, query };
    }
    default: throw new Error("Choose an authentication method.");
  }
}

function customAPIPage(c) {
  const agents = Object.keys(ids()), selected = agents.length === 1 ? agents[0] : "";
  return [head(connectorIcon("api") + "Add Custom API"), `<section><form onsubmit="event.preventDefault(); addCustomAPI()">
    <p>Connect an app using its API key. The agent gets a placeholder; Monitor keeps the real key.</p>

const addCustomAPI = run(async () => {
  if ($("api-add").disabled) return;
  const name = $("account-name").value.trim(), token = $("api-token").value;
  if (!/^[a-zA-Z0-9][a-zA-Z0-9-]*$/.test(name)) throw new Error("Name this account using letters, numbers, and hyphens.");
  if (Object.hasOwn(accounts(), name)) throw new Error("An account with that name already exists. Choose another name.");
  if (!token.trim()) throw new Error("Enter the API key or token.");
  const slot = readAPISlot();
  const acc = { preset: "custom_api", ...answers(), connections: { "": { http: { slots: [slot], values: { token } } } } };
  const body = { accounts: { [name]: acc } };
  const agent = $("api-agent")?.value;
  if (agent) body.identities = { [agent]: { accounts: { [name]: { level: $("api-access").value } } } };
  const from = location.hash;
  $("api-add").disabled = true;
  try {
    await edit((state) => previewConfig(state, body), () => api("PATCH", "/", body), { message: "Account added" });
    if (location.hash === from) location.hash = "account/" + encodeURIComponent(name);
  } finally { if ($("api-add")) $("api-add").disabled = false; }
});

    <p>${slot.query ? `Query parameter: <span class="mono">${esc(slot.query)}=${esc(placeholder)}</span>` : `Header: <span class="mono">${esc(slot.header)}: ${esc((slot.prefix ?? "") + placeholder)}</span>`}</p>

const copyAPIPlaceholder = run(async () => {

function credentialFields(a) {
  return (view.fields?.[a] ?? []).map((meta) => {
    const f = fieldsOf(entry(a)).find((f) => paths(f).some((path) => JSON.stringify(path) === JSON.stringify(meta.path)));
    return { ...f, ...meta, key: meta.path.map(encodeURIComponent).join("/"), label: `${meta.path[1] ? meta.path[1] + ": " : ""}${f?.label ?? meta.path.at(-1)}`, secret: true, multiline: f ? !!f.multiline : true };
  }).sort((a, b) => a.key.localeCompare(b.key));
}

function credentialEditor(a, f) {
  const status = f.kind === "oauth-required" ? "Sign-in required" : f.kind === "unset" ? "Not configured" : "Configured";
  return `<div class="credential"><div>${esc(f.label)} · <span class="muted">${esc(status)}</span></div>
    <input type="hidden" id="mode-${esc(f.key)}" value="keep">

      <button id="replace-${esc(f.key)}" onclick="credentialMode(${q(a)}, ${q(f.key)}, 'replace')">${f.kind === "unset" ? "Set value" : "Replace"}</button>

    <button id="credential-cancel-${esc(f.key)}" hidden onclick="credentialMode(${q(a)}, ${q(f.key)}, 'keep')">Cancel</button></div>`;

function credentialMode(a, key, mode) {
  $("mode-" + key).value = mode;
  $("credential-actions-" + key).hidden = mode !== "keep";
  const editor = $("credential-edit-" + key);
  editor.hidden = mode !== "replace";
  const f = credentialFields(a).find((f) => f.key === key);
  editor.innerHTML = mode === "replace" ? `<label for="f-${esc(key)}">${f.kind === "unset" ? "Value" : "New value"}</label>${input(f)}
    <p class="muted field-help">${f.kind === "unset" ? "Enter a value, then save." : "Your current credential stays in use until you save."}</p>` : "";
  $("credential-remove-" + key).hidden = mode !== "clear";
  $("credential-cancel-" + key).hidden = mode === "keep";
  if (mode === "replace") $("f-" + key).focus();
  else $(mode === "keep" ? "replace-" + key : "credential-cancel-" + key).focus();
}

function actionTree(a) {
  const roots = new Map();
  for (const [key, action] of tree(actionsOf(a))) {
    let children = roots;
    key.split(".").forEach((part, i, parts) => {
      const path = parts.slice(0, i + 1).join(".");
      if (!children.has(part)) children.set(part, { key: path, title: part.charAt(0).toUpperCase() + part.slice(1).replace(/[_-]/g, " "), children: new Map() });
      const node = children.get(part);
      if (path === key) { node.title = action.title || key; node.action = true; }
      children = node.children;
    });
  }
  return [...roots.values()];
}

function accountActions(a) {
  const count = (node) => Number(!!node.action) + [...node.children.values()].reduce((n, child) => n + count(child), 0);
  const renderAction = (node) => {
    const effects = effectsOf(a, node.key), children = [...node.children.values()];
    const total = children.reduce((n, child) => n + count(child), 0);
    const badges = effects.map((effect) => `<span class="badge ${["read", "write", "send", "delete", "admin"].includes(effect) ? "effect-" + effect : ""}">${esc(effect.charAt(0).toUpperCase() + effect.slice(1))}</span>`).join("");
    const row = `<span class="capability-name">${esc(node.title)}${children.length ? ` <small title="${total} subaction${total === 1 ? "" : "s"}" aria-label="${total} subaction${total === 1 ? "" : "s"}">${total}</small>` : ""}</span><span class="effects" aria-label="Effects">${badges || `<span class="muted">No effects</span>`}</span>`;
    return children.length
      ? `<details class="action-group" data-disclosure="${esc(a + "/" + node.key)}"><summary class="capability">${row}</summary><div class="action-children">${children.map(renderAction).join("")}</div></details>`
      : `<div class="capability">${row}</div>`;
  };
  return actionTree(a).map(renderAction).join("") || `<p class="empty">This preset doesn't define any actions yet.</p>`;
}

function accountUsers(a) {
  const users = Object.entries(ids()).filter(([, id]) => (id.accounts?.[a]?.level ?? "off") !== "off");
  return `<section class="account-card"><div class="section-heading"><h2>Used by <span class="count">${users.length}</span></h2></div>
    ${users.length ? `<div class="usage-columns"><span>Agent</span><span>Default access</span></div><ul class="agent-list">${users.map(([name, id]) => {
      const access = id.accounts[a], overrides = Object.values(access.actions ?? {}).filter(Boolean).length;
      return `<li><a class="agent-link" href="#agent/${encodeURIComponent(name)}"><span class="agent-info"><strong>${esc(name)}</strong>${id.profile ? ` <small>Profiling on</small>` : ""} <small>${overrides ? `${overrides} action override${overrides === 1 ? "" : "s"}` : "No action overrides"}</small></span>
        <span class="badge ${["read", "ask", "allow"].includes(access.level) ? "level-" + access.level : ""}">${esc(LEVELS[access.level] ?? access.level)}</span></a></li>`;
    }).join("")}</ul>` : `<p class="empty">No agents have access to this account.</p>`}</section>`;
}

function account(a) {
  const acc = accounts()[a];
  if (!acc) return [head(esc(a)), `<p class="empty">No account ${esc(a)}.</p>`];
  const c = entry(a);
  const fields = plain(c), credentials = credentialFields(a);
  return [`<header class="account-header">${accountIcon(a)}<h1>${esc(a)}</h1><span class="muted">${esc(c.title)} ${accountStatus(a)}</span><a class="x" href="#activity" aria-label="Close account">✕</a></header>`,
    liveCard(a),
    acc.preset === "custom_api" ? apiAgentSetup(a) : "",
    `<div class="account-overview"><section class="account-card"><div class="section-heading"><h2>Actions <span class="count">${Object.keys(actionsOf(a)).length}</span></h2><a href="#preset/${encodeURIComponent(acc.preset)}">Edit preset</a></div>
      <div class="action-list">${accountActions(a)}</div></section>${accountUsers(a)}</div>`,
    `<section class="account-card account-settings"><div class="section-heading"><h2>Account settings</h2></div><div class="settings-fields"><div>${questions(acc)}</div>
      ${fields.length || credentials.length || acc.preset === "custom_api" ? `<div>${acc.preset === "custom_api" ? apiConnectionFields(acc.connections?.[""]?.http?.slots?.[0]) : ""}${fields.map((f) => `<label for="f-${esc(f.key)}">${esc(f.label)}</label>${input(f, fieldValue(acc, f))}`).join("")}${credentials.map((f) => credentialEditor(a, f)).join("")}</div>` : ""}</div>
      <div class="card-footer"><button class="primary" onclick="saveAccount(${q(a)})">Save</button></div></section>`,
    ...mcpKeys(a).map((k) => review(a, k, c)),
    `<section><details data-disclosure="custom-rules"><summary class="hd">Custom rules</summary><textarea id="policy" aria-label="Custom rules" rows="12">${esc(view.config.policies?.[a])}</textarea>
      <div class="row"><span></span><button onclick="patch({ policies: { [${q(a)}]: $('policy').value.trim() || null } })">Save rules</button></div></details></section>`,
    `<section><button class="danger" onclick="removeAccount(${q(a)})">Remove account</button></section>`];
