<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #fff; --line: #e2e2dd; --text: #1d1d1b; --muted: #74746e;
    --accent: #2f5bd3; --ok: #1e8a4c; --warn: #b7791f; --bad: #c0392b; --code: #f1f1ee;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1e1e1c; --line: #33332f; --text: #e8e8e4; --muted: #92928b; --accent: #7b9cff; --ok: #4cc27f; --warn: #e0a84a; --bad: #ff6b5b; --code: #262623; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  pre, textarea, .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
  main { max-width: 52rem; margin: 0 auto; padding: 1rem 1.25rem; }
  nav { display: flex; gap: .25rem; margin-bottom: 1rem; border-bottom: 1px solid var(--line); }
  nav a { padding: .5rem .8rem; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; }
  nav a.active { color: var(--text); border-bottom-color: var(--accent); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 .75rem; font-weight: 600; }
  a { color: var(--accent); }
  button { font: inherit; font-size: 13px; padding: .3rem .7rem; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button.inherited { border-color: var(--accent); color: var(--accent); }
  input, select, textarea { font: inherit; padding: .35rem .5rem; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); width: 100%; }
  input[type=checkbox] { width: auto; }
  label { display: block; font-size: 12px; color: var(--muted); margin: .5rem 0 .2rem; }
  .node { margin-left: calc(var(--depth) * 1.25rem); }
  .row { display: flex; gap: .5rem; align-items: center; justify-content: space-between; margin-top: .5rem; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: .45rem .4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  pre { background: var(--code); padding: .6rem; border-radius: 6px; white-space: pre-wrap; word-break: break-all; max-height: 24rem; overflow: auto; }
  .muted, .empty { color: var(--muted); } .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  #toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: .6rem 1rem; border-radius: 6px; max-width: 40rem; }
</style>
<main id="page"></main>
<div id="toast" hidden></div>
<script>
const KEY = "monitor-owner-key", GENERATION = "monitor-generation", DISMISSED = "monitor-dismissed", RETURN = "monitor-sign-in-return";
const REQUEST_POLL_MS = 5000, TOAST_MS = 5000;
const LEVELS = { off: "No access", read: "Read only", ask: "Ask", allow: "Allow" }, MODES = { allow: "Allow", ask: "Ask", off: "Deny" }, AUDIENCES = ["me", "team", "anyone"];
const WHO = { me: "Only me", team: "My team", anyone: "Anyone" };
const SEES = { me: "only you", team: "your team", anyone: "anyone" };
const STATE_CLASS = { allowed: "ok", approved: "ok", refused: "bad", denied: "bad", expired: "warn", pending: "warn" };

let view = null, records = [], locked = false;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const q = (v) => esc(JSON.stringify(v));
const opt = (value, text, selected) => `<option value="${esc(value)}" ${value === selected ? "selected" : ""}>${esc(text)}</option>`;
const ids = () => view.config.identities ?? {};
const accounts = () => view.config.accounts ?? {};
const entry = (account) => view.templates[accounts()[account]?.policy_options?.preset] ?? view.templates[accounts()[account]?.template] ?? view.templates.custom;
// Each pinned MCP tool is an action under read or use, by the hint the owner approved with the pin.
const actionsOf = (account) => ({ ...groupsOf(account), ...entry(account).actions, ...Object.fromEntries(Object.values(accounts()[account]?.connections ?? {})
  .flatMap((c) => c.mcp?.pin?.tools ?? []).map((t) => [`${t.annotations?.readOnlyHint ? "read" : "use"}.${t.name}`, { title: t.title || t.name }])) });
// An api account's actions are the permission groups of its service record's or preset's operations.
const operationsOf = (account) => accounts()[account]?.template === "api"
  ? view.config.data?.services?.[accounts()[account]?.policy_options?.service]?.operations ?? entry(account).operations ?? [] : [];
const groupsOf = (account) => Object.fromEntries([...operationsOf(account).map((o) => [o.action, { title: o.action }]),
  ...(accounts()[account]?.template === "api" ? [["unreviewed", { title: "Requests no operation matches" }]] : [])]);
// effectsOf unions the effects of every operation under an action, so a group shows its strictest obligations.
const effectsOf = (account, k) => entry(account).effects?.[k.split(".")[0]]
  ?? [...new Set(operationsOf(account).filter((o) => o.action === k || o.action.startsWith(k + ".")).flatMap((o) => o.effects))];
const tree = (actions) => Object.entries(actions).sort(([a], [b]) => a.localeCompare(b)).map(([k, x]) => [k, x, k.split(".").length - 1]);
const fill = (text, scope) => text.replace(/\{(\w+)\}/g, (m, k) => scope?.[k] ?? m);
const route = () => location.hash.slice(1).split("/").map(decodeURIComponent);

function toast(text) {
  $("toast").textContent = text;
  $("toast").hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => ($("toast").hidden = true), TOAST_MS);
}

// run surfaces a failed action as a toast.
const run = (fn) => async (...args) => {
  try { await fn(...args); } catch (err) { toast(err.message); }
};

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { Authorization: "Bearer " + sessionStorage.getItem(KEY) }, body: body && JSON.stringify(body) });
  const text = await res.text();
  if (res.status === 401) sessionStorage.removeItem(KEY);
  locked = res.status === 423;
  if (!res.ok) { render(); throw new Error(text.trim()); }
  return text ? JSON.parse(text) : null;
}

function remember(v) {
  view = v;
  localStorage.setItem(GENERATION, Math.max(v.generation, +localStorage.getItem(GENERATION) || 0));
}

async function refresh() {
  remember(await api("GET", "/"));
  records = await api("GET", "/requests");
  const pending = records.filter((r) => r.state === "pending").length;
  document.title = pending ? `(${pending}) Monitor` : "Monitor";
}

const patch = run(async (body, then) => {
  remember(await api("PATCH", "/", body));
  toast("Saved");
  then ? (location.hash = then) : render();
});

function render() {
  const [page, arg] = route();
  const pages = { requests, activity, agents, agent, accounts: accountList, account, add, settings };
  let html;
  if (!sessionStorage.getItem(KEY)) html = keyPage();
  else if (locked) html = `<section><p>Your monitor restarted.</p><button class="primary" onclick="unlock()">Unlock</button></section>`;
  else if (!view) html = `<p class="empty">Loading…</p>`;
  else html = nav(page || "requests") + (pages[page] ?? requests)(arg);
  $("page").innerHTML = html;
}

function nav(page) {
  const pending = records.filter((r) => r.state === "pending").length;
  const tabs = [["requests", `Requests${pending ? ` (${pending})` : ""}`], ["agents", "Agents"], ["accounts", "Accounts"], ["activity", "Activity"], ["settings", "Settings"]];
  const active = { agent: "agents", account: "accounts", add: "accounts" }[page] ?? page;
  return `<nav>${tabs.map(([p, t]) => `<a href="#${p}" class="${p === active ? "active" : ""}">${t}</a>`).join("")}</nav>`;
}

function keyPage() {
  return `<section><label>Owner key</label><input id="key" type="password"><div class="row"><span></span><button class="primary" onclick="setKey()">Continue</button></div></section>`;
}

const setKey = run(async () => {
  sessionStorage.setItem(KEY, $("key").value.trim());
  await refresh();
  render();
});

const unlock = run(async () => {
  remember(await api("POST", "/unlock", { generation: +localStorage.getItem(GENERATION) || 0 }));
  await refresh();
  render();
});

function summary(e) {
  if (e?.http) return `${e.http.method} ${e.http.host}${e.http.path}`;
  if (e?.smtp) return `To ${e.smtp.to.join(", ")}${e.mail?.subject ? `: ${e.mail.subject}` : ""}`;
  if (e?.imap) return `${e.imap.command} ${e.imap.args}`;
  if (e?.mcp) return e.mcp.tool;
  return "";
}

function reasons(r) {
  const title = entry(r.account).title;
  return r.gaps.map((g) => ({
    ask: r.action == null ? `${title} doesn't recognize this request.` : `You asked to approve changes on ${r.account}.`,
    audience: `It has seen private data from ${r.label.because?.audience}, and ${SEES[r.sends]} can see this.`,
    trust: `It has read content from strangers on ${r.label.because?.trust}, so it may be following their instructions.`,
  })[g]);
}

// A saved approval binds one operation and its grant. The text names fields, not values, which can be whole messages;
// fields left out of the grant are named as broad.
function grantText(operation, grant, scope) {
  const fields = Object.keys(grant ?? {}), broad = Object.keys(scope ?? {}).filter((k) => !fields.includes(k));
  return `Allow ${operation} ${fields.length ? "for the same " + fields.join(", ") : "for any request"}`
    + (broad.length ? `, with any ${broad.join(", ")}` : "");
}
const saveText = (r) => grantText(r.operation, r.grant, r.scope);

function card(r) {
  const pending = r.state === "pending";
  const save = r.action == null || !r.operation ? "" : `<button class="${pending ? "primary" : ""}" onclick="answer('${r.id}', 'save')">${esc(saveText(r))}</button>`;
  const buttons = pending
    ? `<button onclick="answer('${r.id}', 'deny')">Deny</button><button onclick="answer('${r.id}', 'once')">Allow once</button>${save}`
    : `${save}<button onclick="dismiss('${r.id}')">Dismiss</button>`;
  return `<section>
    <div class="row"><b>${esc(r.title || summary(r.event))}</b><span class="muted">${esc(r.identity)} · ${pending ? "waiting" : "expired"}</span></div>
    <ul>${reasons(r).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
    <div class="mono">${esc(summary(r.event))}</div>
    ${r.operation ? `<details><summary class="muted">${esc(r.operation)} grant</summary><pre>${esc(JSON.stringify(r.grant))}</pre></details>` : ""}
    <details><summary class="muted">Request</summary><pre>${esc(JSON.stringify(r.event, null, 2))}</pre></details>
    <div class="row"><span></span><span>${buttons}</span></div>
  </section>`;
}

function requests() {
  const dismissed = JSON.parse(localStorage.getItem(DISMISSED) ?? "[]");
  const open = records.filter((r) => r.state === "pending" || (r.state === "expired" && !dismissed.includes(r.id)));
  return open.map(card).join("") || `<p class="empty">Nothing needs you.</p>`;
}

const answer = run(async (id, decision) => {
  await api("POST", `/requests/${id}`, { decision });
  await refresh();
  render();
});

function dismiss(id) {
  localStorage.setItem(DISMISSED, JSON.stringify([...JSON.parse(localStorage.getItem(DISMISSED) ?? "[]"), id]));
  render();
}

function activity(agent) {
  const rows = records.filter((r) => !agent || r.identity === agent).map((r) => `<tr>
    <td class="muted">${new Date(r.time).toLocaleTimeString()}</td><td>${esc(r.identity)}</td>
    <td>${esc(r.title || summary(r.event) || r.account)}</td><td class="${STATE_CLASS[r.state]}">${r.state}</td></tr>`);
  return `<select onchange="location.hash = 'activity/' + encodeURIComponent(this.value)">${opt("", "All agents", agent ?? "")}${Object.keys(ids()).map((n) => opt(n, n, agent)).join("")}</select>
    <table>${rows.join("") || `<tr><td class="empty">Nothing yet.</td></tr>`}</table>`;
}

function labelStatus(l) {
  const lines = [l?.audience !== "anyone" && `Has seen private data from ${l.because?.audience}`, l?.trust === "untrusted" && "Has read content from strangers"];
  return lines.filter(Boolean).join(" · ") || "Clean";
}

function agents() {
  const list = Object.keys(ids()).map((n) => `<div class="row"><a href="#agent/${encodeURIComponent(n)}">${esc(n)}</a><span class="muted">${esc(labelStatus(view.labels[n]))}</span></div>`);
  return `<section>${list.join("") || `<p class="empty">No agents yet.</p>`}</section>
    <section><h2>Pair an agent</h2><label>Name</label><input id="name"><label>Public key</label><textarea id="pubkey" rows="2"></textarea>
    <div class="row"><span></span><button class="primary" onclick="pair()">Pair</button></div></section>`;
}

const pair = () => patch({ identities: { [$("name").value.trim()]: { key: $("pubkey").value.trim(), accounts: {} } } }, "agent/" + encodeURIComponent($("name").value.trim()));

function ruleSentence(r) {
  if (!r.operation) return `Inactive: ${r.action} on ${r.account} was saved before approvals named an operation`;
  return `${grantText(r.operation, r.scope, r.scope)} on ${r.account}, despite ${r.waives.join(" and ")}`;
}

// mode mirrors lib.rego: the most specific override wins, effects that ask still ask at allow,
// effects without change are allowed and the rest follow the level.
function mode(access, vocabulary, effects, k) {
  const lineage = k.split(".").map((_, i, p) => p.slice(0, p.length - i).join("."));
  const has = (name) => effects.some((e) => vocabulary[e]?.[name]);
  return lineage.map((a) => access.actions?.[a]).find(Boolean)
    ?? (k === "unreviewed" ? "off" : null)
    ?? (access.level === "allow" && has("ask") ? "ask" : has("change") ? (access.level === "read" ? "off" : access.level) : "allow");
}

function agent(name) {
  const id = ids()[name];
  if (!id) return `<p class="empty">No agent ${esc(name)}.</p>`;
  const levels = Object.entries(accounts()).map(([a, acc]) => {
    const access = id.accounts?.[a] ?? { level: "off" };
    const c = entry(a);
    const actions = access.level === "off" ? [] : tree(actionsOf(a)).map(([k, x, d]) => {
      const effects = effectsOf(a, k), inherited = mode({ ...access, actions: { ...access.actions, [k]: null } }, c.vocabulary, effects, k);
      const own = access.actions?.[k];
      return `<div class="row node" style="--depth: ${d}"><span>${esc(x.title)} <span class="muted">${esc(effects.join(", "))}</span></span><span>${Object.entries(MODES).map(([m, t]) =>
        `<button class="${m === own ? "primary" : !own && m === inherited ? "inherited" : ""}" onclick="patchAccess(${q(name)}, ${q(a)}, { actions: { [${q(k)}]: ${q(m === own ? null : m)} } })">${t}</button>`).join(" ")}</span></div>`;
    });
    return `<tr><td><div class="row"><b>${esc(a)}</b><span>${Object.entries(LEVELS).map(([l, t]) =>
      `<button class="${l === access.level ? "primary" : ""}" onclick="patchAccess(${q(name)}, ${q(a)}, { level: ${q(l)} })">${t}</button>`).join(" ")}</span></div>${actions.join("")}</td></tr>`;
  });
  const rules = (id.rules ?? []).map((r, i) => `<div class="row"><span>${esc(ruleSentence(r))}${r.operation
    ? `<details><summary class="muted">grant</summary><pre>${esc(JSON.stringify(r.scope))}</pre></details>` : ""}</span><button onclick="removeRule(${q(name)}, ${i})">Remove</button></div>`);
  const reaches = (pred) => Object.entries(accounts()).some(([a, acc]) => (id.accounts?.[a]?.level ?? "off") !== "off" && pred(acc));
  const hint = reaches((acc) => acc.template === "web") && reaches((acc) => acc.contents !== "anyone")
    ? `<p class="warn">Once it reads private data, browsing will need approval. A separate agent for browsing avoids that.</p>` : "";
  const others = Object.keys(ids()).filter((n) => n !== name);
  const l = view.labels[name] ?? {};
  const point = (axis, values) => `<div class="row"><span>${axis}</span><span>${values.map((v) =>
    `<button class="${l[axis] === v ? "primary" : ""}" onclick="setLabel(${q(name)}, ${q({ trust: l.trust, audience: l.audience, [axis]: v })})">${v}</button>`).join(" ")}</span></div>`;
  return `<section><h2>${esc(name)} · ${esc(labelStatus(l))}</h2>${hint}${point("trust", ["trusted", "untrusted"])}${point("audience", ["anyone", "team", "me"])}<table>${levels.join("")}</table></section>
    <section><h2>Saved rules</h2>${rules.join("") || `<p class="empty">None yet. They come from “Allow this next time”.</p>`}</section>
    <section><h2>Setup</h2><label>Host key</label><pre>${esc(view.host_key)}</pre><label>CA</label><pre>${esc(view.ca)}</pre><label>Environment</label><pre>${esc(view.setup[name]) || "No secrets to substitute."}</pre></section>
    <section><h2>Replace key</h2><p class="muted">Use this after recreating the sandbox. The agent starts clean.</p><textarea id="pubkey" rows="2"></textarea>
      <div class="row"><span></span><button onclick="patch({ identities: { [${q(name)}]: { key: $('pubkey').value.trim() } } })">Replace key</button></div></section>
    ${others.length ? `<section><h2>Copy settings from</h2><div class="row"><select id="from">${others.map((n) => opt(n, n)).join("")}</select><button onclick="copySettings(${q(name)})">Copy</button></div></section>` : ""}
    <button class="danger" onclick="patch({ identities: { [${q(name)}]: null } }, 'agents')">Remove agent</button>`;
}

const patchAccess = (name, account, access) => patch({ identities: { [name]: { accounts: { [account]: access } } } });

const setLabel = run(async (name, label) => {
  remember(await api("POST", "/labels/" + encodeURIComponent(name), label));
  render();
});

const removeRule = (name, i) => patch({ identities: { [name]: { rules: ids()[name].rules.filter((_, j) => j !== i) } } });

// Merge patches merge nested objects, so the old settings are cleared before the copy lands.
const copySettings = run(async (name) => {
  const from = ids()[$("from").value];
  remember(await api("PATCH", "/", { identities: { [name]: { accounts: null, rules: null } } }));
  patch({ identities: { [name]: { accounts: from.accounts ?? {}, rules: from.rules ?? [] } } });
});

const mcpKeys = (a) => Object.entries(accounts()[a].connections ?? {}).filter(([, kinds]) => kinds.mcp).map(([key]) => key);
const connName = (a, key) => (key ? `${a}-${key}` : a);

function accountStatus(a) {
  const states = mcpKeys(a).map((k) => view.status[connName(a, k)] ?? {});
  if (states.some((s) => s.error)) return `<span class="bad">Can't connect</span>`;
  if (states.some((s) => s.state === "connecting")) return `<span class="muted">Connecting…</span>`;
  const blocked = states.reduce((n, s) => n + (s.blocked ?? 0), 0);
  return blocked ? `<span class="warn">${blocked} tools await review</span>` : `<span class="ok">Ready</span>`;
}

function accountList() {
  const list = Object.entries(accounts()).map(([a, acc]) => `<div class="row"><a href="#account/${encodeURIComponent(a)}">${esc(a)}</a><span class="muted">${esc(entry(a).title)} · ${accountStatus(a)}</span></div>`);
  return `<section>${list.join("") || `<p class="empty">No accounts yet.</p>`}</section>
    <section><h2>Add account</h2>${Object.entries(view.templates).map(([t, c]) => `<button onclick="location.hash = 'add/${t}'">${c.title}</button>`).join(" ")}</section>`;
}

function questions(a) {
  const pick = (id, value) => `<select id="${id}">${AUDIENCES.map((x) => opt(x, WHO[x], value)).join("")}</select>`;
  return `<label>Who should see what's in here?</label>${pick("contents", a.contents)}
    <label><input type="checkbox" id="strangers" ${a.strangers ? "checked" : ""}> Strangers can put content here</label>
    <label>Who sees what the agent sends here?</label>${pick("sends", a.sends)}`;
}

const answers = () => ({ contents: $("contents").value, strangers: $("strangers").checked, sends: $("sends").value });

function input(f, value, disabled = false) {
  const state = disabled ? "disabled" : "";
  if (f.json) value = value === undefined ? "" : JSON.stringify(value, null, 2);
  if (f.json || f.multiline) return `<textarea id="f-${esc(f.key)}" ${state} rows="6">${esc(value)}</textarea>`;
  return `<input id="f-${esc(f.key)}" ${state} type="${f.secret ? "password" : "text"}" placeholder="${esc(f.hint)}" value="${esc(f.list ? (value ?? []).join(", ") : value)}">`;
}

function read(f) {
  const raw = $("f-" + f.key).value;
  const v = f.secret ? raw : raw.trim();
  if (f.json) return v ? JSON.parse(v) : {};
  return f.list ? v.split(/[\s,]+/).filter(Boolean) : v;
}

const atPath = (object, path) => path.reduce((value, key) => value?.[key], object);
function putPath(object, path, value) {
  for (const key of path.slice(0, -1)) {
    if (!Object.hasOwn(object, key)) Object.defineProperty(object, key, { value: {}, enumerable: true });
    object = object[key];
  }
  Object.defineProperty(object, path.at(-1), { value, enumerable: true, configurable: true, writable: true });
}
const paths = (f) => f.paths ?? [f.path];
// A field with no paths, such as an OAuth client ID, only fills the account's templates when it is created.
const plain = (c) => c.fields.filter((f) => !f.secret && paths(f).length);
const fieldValue = (acc, f) => atPath(acc, f.path ?? paths(f)[0]) ?? (f.list ? [] : f.json ? {} : "");
// A merge patch replaces an array whole, so a setting inside one, such as a slot's origin, rewrites a copy of its array.
function putSetting(update, acc, path, value) {
  const n = path.findIndex((_, i) => i > 0 && Array.isArray(atPath(acc, path.slice(0, i))));
  if (n < 0) return putPath(update, path, value);
  const list = atPath(update, path.slice(0, n)) ?? JSON.parse(JSON.stringify(atPath(acc, path.slice(0, n))));
  path.slice(n, -1).reduce((o, k) => o[k], list)[path.at(-1)] = value;
  putPath(update, path.slice(0, n), list);
}
const filled = (c, values) => JSON.parse(JSON.stringify(c), (_, v) => typeof v === "string" ? fill(v, values) : v);

// Used for the custom JSON editor so removed settings become explicit deletions.
function changes(before, after) {
  if (JSON.stringify(before) === JSON.stringify(after)) return undefined;
  if (after === null || typeof after !== "object" || Array.isArray(after)) return after;
  return Object.fromEntries([...new Set([...Object.keys(before ?? {}), ...Object.keys(after)])]
    .map((key) => [key, Object.hasOwn(after, key) ? changes(before?.[key], after[key]) : null])
    .filter(([, value]) => value !== undefined));
}

function add(template) {
  const c = view.templates[template];
  if (!c) return `<p class="empty">No template ${esc(template)}.</p>`;
  return `<section><h2>Add ${esc(c.title)}</h2><label>Name</label><input id="account-name" value="${esc(template)}">
    ${c.fields.filter((f) => !f.edit_only).map((f) => `<label>${esc(f.label)}</label>${f.secret && !f.json ? `<select id="mode-${esc(f.key)}" onchange="$(${q("f-" + f.key)}).disabled = this.value !== 'replace'">${opt("replace", "Set value", f.oauth ? "oauth" : "replace")}${opt("clear", "Leave unconfigured")}${f.oauth ? opt("oauth", "Sign in after creating", "oauth") : ""}</select>` : ""}${input(f, f.default, !!f.oauth)}`).join("")}
    ${questions(c.defaults)}<div class="row"><span></span><button class="primary" onclick="addAccount(${q(template)})">Add</button></div></section>`;
}

const addAccount = run(async (template) => {
  const c = view.templates[template], name = $("account-name").value.trim();
  const fields = c.fields.filter((f) => !f.edit_only);
  const values = Object.fromEntries(fields.map((f) => [f.key, read(f)]));
  // Only the non-secret values fill a preset's connections; secrets go to their fields' paths.
  const plainValues = Object.fromEntries(fields.filter((f) => !f.secret).map((f) => [f.key, values[f.key]]));
  const acc = { template: c.preset ? "api" : template, ...(c.preset && { policy_options: { preset: c.preset } }), ...answers(),
    connections: c.connections ? filled(c.connections, c.preset ? plainValues : values) : values.connections };
  for (const f of fields) {
    const mode = f.secret ? $("mode-" + f.key).value : "replace";
    const value = mode === "clear" ? null : mode === "oauth" ? { oauth: filled(f.oauth, values) } : values[f.key];
    for (const path of paths(f)) putPath(acc, path, value);
  }
  await patch({ accounts: { [name]: acc } }, "account/" + encodeURIComponent(name));
});

function credentialFields(a) {
  return (view.fields?.[a] ?? []).map((meta) => {
    const f = entry(a).fields.find((f) => paths(f).some((path) => JSON.stringify(path) === JSON.stringify(meta.path)));
    return { ...f, ...meta, key: meta.path.map(encodeURIComponent).join("/"), label: `${meta.path[1] || "Default"}: ${f?.label ?? meta.path.at(-1)}`, secret: true, multiline: true };
  }).sort((a, b) => a.key.localeCompare(b.key));
}

function credentialEditor(a, f) {
  const status = f.kind === "oauth-required" ? "Sign-in required" : f.kind === "unset" ? "Not configured" : `Configured · ${f.kind}`;
  return `<label>${esc(f.label)} · ${esc(status)}</label>
    <select id="mode-${esc(f.key)}" onchange="$(${q("f-" + f.key)}).disabled = this.value !== 'replace'"><option value="keep">Keep unchanged</option><option value="replace">Replace value</option><option value="clear">Clear credential</option></select>
    ${input(f, undefined, true)}${f.kind.startsWith("oauth") || grantTemplate(a, f) ? `<div class="row"><span></span><button onclick="signIn(${q(a)}, ${q(f.key)})">Sign in</button></div>` : ""}`;
}

function account(a) {
  const acc = accounts()[a];
  if (!acc) return `<p class="empty">No account ${esc(a)}.</p>`;
  const c = entry(a);
  const users = Object.entries(ids()).filter(([, id]) => (id.accounts?.[a]?.level ?? "off") !== "off").map(([n, id]) => `${n} (${id.accounts[a].level})`);
  return `<section><h2>${esc(a)} · ${esc(c.title)}</h2>${questions(acc)}
      ${plain(c).map((f) => `<label>${esc(f.label)}</label>${input(f, fieldValue(acc, f))}`).join("")}
      ${credentialFields(a).map((f) => credentialEditor(a, f)).join("")}
      <div class="row"><span></span><button onclick="saveAccount(${q(a)})">Save</button></div></section>
    <section><h2>Actions</h2>${tree(actionsOf(a)).map(([k, x, d]) => `<div class="node" style="--depth: ${d}">${esc(x.title)} <span class="muted">${esc(effectsOf(a, k).join(", "))}</span></div>`).join("")}<p class="muted">Used by ${esc(users.join(", ") || "no agents")}</p></section>
    <div id="connector-status">${mcpKeys(a).map((k) => review(a, k, c)).join("")}</div>
    <section><details><summary class="muted">Advanced → Custom rules</summary><textarea id="policy" rows="12">${esc(view.config.policies?.[a])}</textarea>
      <div class="row"><span></span><button onclick="patch({ policies: { [${q(a)}]: $('policy').value.trim() || null } })">Save rules</button></div></details></section>
    <button class="danger" onclick="removeAccount(${q(a)})">Remove account</button>`;
}

function review(a, key, c) {
  const name = connName(a, key), s = view.status[name] ?? {};
  if (s.state === "connecting") return `<section><h2>${esc(name)}</h2><p class="muted">Connecting…</p></section>`;
  if (s.error) return `<section><h2>${esc(name)}</h2><p class="bad">Can't connect: ${esc(s.error)}</p></section>`;
  if (!s.blocked) return "";
  const count = (sign) => s.changes.filter((x) => x.startsWith(sign)).length;
  return `<section><h2>${esc(name)}</h2><p>${c.title} changed its tools: ${count("+")} new, ${count("~")} changed, ${count("-")} removed.</p>
    <details><summary class="muted">${s.blocked} tools await review</summary><pre>${esc(s.changes.join("\n\n"))}</pre></details>
    <div class="row"><span></span><button class="primary" onclick="approve(${q(a)}, ${q(key)})">Approve</button></div></section>`;
}

const approve = (a, key) => patch({ accounts: { [a]: { connections: { [key]: { mcp: { pin: view.status[connName(a, key)].pin } } } } } });

const saveAccount = (a) => {
  const acc = accounts()[a], update = answers();
  for (const f of plain(entry(a))) {
    const value = read(f);
    const delta = changes(fieldValue(acc, f), value);
    if (delta !== undefined) for (const path of paths(f)) putSetting(update, acc, path, delta);
  }
  for (const f of credentialFields(a)) {
    const mode = $("mode-" + f.key).value;
    if (mode === "replace") putPath(update, f.path, read(f));
    if (mode === "clear") putPath(update, f.path, null);
  }
  return patch({ accounts: { [a]: update } });
};

// A grant template fills from the account's plain settings; one that needs a setup-only value, such as an OAuth client, cannot.
function grantTemplate(a, f) {
  const values = Object.fromEntries(plain(entry(a)).map((p) => [p.key, fieldValue(accounts()[a], p)]));
  const grant = f?.oauth && filled(f.oauth, values);
  return grant && !/\{\w+\}/.test(JSON.stringify(grant)) ? grant : undefined;
}

// Sign-in leaves the current credential usable until the exchange succeeds.
const signIn = run(async (a, key) => {
  const f = credentialFields(a).find((f) => f.key === key);
  // A stored grant keeps its client and endpoints; only an unset or static value starts from the template.
  const grant = f?.kind?.startsWith("oauth") ? undefined : grantTemplate(a, f);
  const credential = grant && { oauth: grant };
  const { url } = await api("POST", `/accounts/${encodeURIComponent(a)}/sign-in`, { path: f.path, redirect: location.origin + location.pathname, credential });
  sessionStorage.setItem(RETURN, location.hash);
  location.href = url;
});

// Identities may not name a missing account, so removing one also clears it from every agent.
const removeAccount = (a) => patch({
  accounts: { [a]: null },
  policies: { [a]: null },
  identities: Object.fromEntries(Object.keys(ids()).map((n) => [n, { accounts: { [a]: null } }])),
}, "accounts");

function settings() {
  return `<section><h2>Networks</h2><label>Private networks the monitor may reach, one per line</label>
    <textarea id="networks" rows="4">${esc((view.config.allow_networks ?? []).join("\n"))}</textarea>
    <div class="row"><span></span><button onclick="patch({ allow_networks: $('networks').value.split(/\\s+/).filter(Boolean) })">Save</button></div></section>`;
}

window.addEventListener("hashchange", render);
setInterval(run(async () => {
  if (!sessionStorage.getItem(KEY) || locked) return;
  await refresh();
  const [page, a] = route();
  if (["", "requests", "activity", "accounts"].includes(page)) render();
  if (page === "account" && accounts()[a] && $("connector-status")) $("connector-status").innerHTML = mcpKeys(a).map((k) => review(a, k, entry(a))).join("");
}), REQUEST_POLL_MS);
// The provider redirects back here with the sign-in's state and either a code or an error.
const back = new URLSearchParams(location.search);
if (back.has("state")) history.replaceState(null, "", location.pathname + (sessionStorage.getItem(RETURN) ?? ""));
run(async () => {
  if (!sessionStorage.getItem(KEY)) return;
  await refresh();
  if (back.has("error")) throw new Error(back.get("error_description") ?? back.get("error"));
  if (!back.has("code")) return;
  render();
  toast("Finishing sign-in…");
  remember(await api("POST", `/sign-in/${encodeURIComponent(back.get("state"))}`, { code: back.get("code") }));
  toast("Signed in");
})().then(render);
</script>
