# Provisioning sets the measured owner public key.
cvm-version: 0.15.1-rc.3@sha256:e1c8d17c7d79663c365169a796eec06116f483825028fad5faddfe9839321217
cvm-network:
  inbound-ports: [443, 22]
cpus: 2
memory: 2048

shim:
  upstream-port: 8080
  authenticated: false
  paths:
    - /healthz

networks:
  upstream:
    egress: open

attested-keys:
  - id: host-ssh
    key: ed25519
    uid: 65532
    gid: 65532

containers:
  - name: monitor
    image: "ghcr.io/tinfoilsh/confidential-agent-monitor@sha256:2632c7285174c4c7b81522e9bd391732ee5947ec9b2a9b1bad8dfbff33797758" # v0.1.3
    user: "65532:65532"
    keys: [host-ssh]
    ports: ["22:2223"]
    networks: [upstream]
    env:
      - MONITOR_OWNER_PUBLIC_KEY: ""
      - TINFOIL_STORAGE_BUCKET: ""
      - AWS_CONTAINER_CREDENTIALS_FULL_URI: ""
    secrets:
      - AWS_CONTAINER_AUTHORIZATION_TOKEN
    command:
      - -production
      - -ssh-host-key
      - /run/tinfoil/keys/host-ssh/private_key.pem
      - -api
      - 0.0.0.0:8080
      - -listen
      - 0.0.0.0:2223
    read_only: true
    tmpfs:
      /tmp: rw,noexec,nosuid,nodev,size=64m
    restart: always
    healthcheck:
      test: ["CMD", "/monitor", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
