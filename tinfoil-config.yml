# Provisioning binds MONITOR_OWNER_KEY_SHA256 as measured container env.
cvm-version: 0.15.1-rc.2@sha256:ea4592d1970afcbfe0c5265e2e3c100225ee98c207ea98ce34e4fc530a0438a6
cvm-network:
  inbound-ports: [443, 22]
cpus: 2
memory: 2048

shim:
  upstream-port: 8080
  authenticated: false
  paths:
    - /healthz
    - /app/*
    - /
    - /unlock
    - /presets/*
    - /labels/*
    - /accounts/*
    - /sign-in/*
    - /connections/*
    - /requests*
    - /policy*

networks:
  upstream:
    egress: open

attested-keys:
  - id: host-ssh
    key: ed25519
    uid: 65532
    gid: 65532

containers:
  - name: monitor
    image: "ghcr.io/tinfoilsh/confidential-agent-monitor@sha256:d2da47fe69dae8bc292cddfc500e966baf457dfc9dfa792df3f6962fa7ccf904" # v0.1.0-private.1
    user: "65532:65532"
    keys: [host-ssh]
    ports: ["22:2223"]
    networks: [upstream]
    env:
      - MONITOR_OWNER_KEY_SHA256
      - TINFOIL_STORAGE_BUCKET
      - AWS_CONTAINER_CREDENTIALS_FULL_URI
    secrets:
      - AWS_CONTAINER_AUTHORIZATION_TOKEN
    command:
      - -production
      - -ssh-host-key
      - /run/tinfoil/keys/host-ssh/private_key.pem
      - -api
      - 0.0.0.0:8080
      - -listen
      - 0.0.0.0:2223
    read_only: true
    tmpfs:
      /tmp: rw,noexec,nosuid,nodev,size=64m
    restart: always
    healthcheck:
      test: ["CMD", "/monitor", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
