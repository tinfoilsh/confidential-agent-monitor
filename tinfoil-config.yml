# Provisioning sets the measured owner public key.
cvm-version: 0.15.3-rc.1@sha256:ddd2e76a629df1bd4ec507441a387ac5db010ebc1bda3e372756e095df8692eb
cvm-network:
  inbound-ports: [443, 22]
cpus: 2
memory: 2048

shim:
  upstream-port: 8080
  authenticated: false
  paths:
    - /healthz
    # Owner sessions are Noise handshakes to owner-session, signed by the measured owner key.
    - /owner/ws
  origins:
    - https://console.tinfoil.sh
    - https://terminal.tinfoil.sh

networks:
  upstream:
    egress: open

attested-keys:
  - id: host-ssh
    key: ed25519
    uid: 0
    gid: 0
  - id: owner-session
    key: x25519
    uid: 0
    gid: 0

containers:
  - name: monitor
    image: "ghcr.io/tinfoilsh/confidential-agent-monitor@sha256:ba81a72b5124044a0049619630e93f9b2cca1e493c46eec3667067491f8d0a47" # v0.1.57
    # The Monitor holds keys and tokens; root/cvm_admin also lets it launch namespaces.
    cvm_admin: true
    user: "0:0"
    keys: [host-ssh, owner-session]
    ports: ["22:2223"]
    networks: [upstream]
    env:
      - MONITOR_OWNER_PUBLIC_KEY: ""
      - TINFOIL_STORAGE_BUCKET: ""
      - AWS_CONTAINER_CREDENTIALS_FULL_URI: ""
    secrets:
      - AWS_CONTAINER_AUTHORIZATION_TOKEN
    command:
      - -production
      - -connector-workers
      - -ssh-host-key
      - /run/tinfoil/keys/host-ssh/private_key.pem
      - -owner-session-key
      - /run/tinfoil/keys/owner-session/private_key.pem
      - -api
      - 0.0.0.0:8080
      - -listen
      - 0.0.0.0:2223
    read_only: true
    tmpfs:
      /tmp: rw,noexec,nosuid,nodev,size=64m
    restart: always
    healthcheck:
      test: ["CMD", "/monitor", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
